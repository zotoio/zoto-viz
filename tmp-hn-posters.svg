<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f2e4"/>
      <stop offset="45%" stop-color="#ede4d0"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="spot" cx="62%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fff8ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f5f0e6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="posterClip">
      <rect x="680" y="120" width="520" height="680" rx="4"/>
    </clipPath>
  </defs>

  <!-- Full frame background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant horizon bands -->
  <rect y="620" width="1600" height="80" fill="#c9b896" opacity="0.5"/>
  <rect y="680" width="1600" height="120" fill="#b8a078" opacity="0.6"/>
  <rect y="780" width="1600" height="120" fill="#000"/>

  <!-- Celestial accent circles (APOD vibe) -->
  <circle cx="1280" cy="180" r="90" fill="#ff6600" opacity="0.12"/>
  <circle cx="1280" cy="180" r="55" fill="#ff6600" opacity="0.22"/>
  <circle cx="220" cy="140" r="40" fill="#000" opacity="0.08"/>

  <!-- Gallery wall silhouette -->
  <path d="M0 520 L420 480 L680 510 L900 470 L1200 500 L1600 460 L1600 780 L0 780 Z" fill="#1a1510" opacity="0.35"/>

  <!-- Dramatic spotlight -->
  <ellipse cx="940" cy="200" rx="480" ry="520" fill="url(#glow)" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- Floor reflection strip -->
  <rect x="0" y="780" width="1600" height="8" fill="#ff6600" opacity="0.6"/>

  <!-- Left: "horrible" glitch poster fragments -->
  <g opacity="0.85">
    <rect x="80" y="200" width="140" height="200" fill="#000" transform="rotate(-8 150 300)"/>
    <rect x="95" y="215" width="110" height="30" fill="#ff6600" transform="rotate(-8 150 300)"/>
    <rect x="95" y="260" width="90" height="8" fill="#f5f0e6" transform="rotate(-8 150 300)"/>
    <rect x="95" y="278" width="70" height="8" fill="#f5f0e6" opacity="0.5" transform="rotate(-8 150 300)"/>
    <!-- glitch blocks -->
    <rect x="200" y="280" width="60" height="18" fill="#ff6600" transform="rotate(12 230 289)"/>
    <rect x="210" y="310" width="80" height="12" fill="#000" transform="rotate(12 250 316)"/>
    <rect x="120" y="420" width="100" height="140" fill="#333" transform="rotate(5 170 490)"/>
    <rect x="130" y="440" width="80" height="15" fill="#ff6600" transform="rotate(5 170 490)"/>
    <rect x="280" y="380" width="90" height="120" fill="#000" transform="rotate(-15 325 440)"/>
    <rect x="290" y="395" width="70" height="70" fill="#ff6600" opacity="0.4" transform="rotate(-15 325 440)"/>
    <!-- pixel noise -->
    <g fill="#000" opacity="0.6">
      <rect x="340" y="180" width="12" height="12"/><rect x="360" y="180" width="12" height="12" fill="#ff6600"/>
      <rect x="380" y="180" width="12" height="12"/><rect x="340" y="200" width="12" height="12"/>
      <rect x="360" y="200" width="12" height="12" fill="#ff6600"/><rect x="380" y="200" width="12" height="12"/>
      <rect x="400" y="220" width="12" height="12"/><rect x="420" y="220" width="12" height="12" fill="#ff6600"/>
      <rect x="440" y="240" width="12" height="12"/><rect x="460" y="240" width="12" height="12"/>
      <rect x="480" y="260" width="12" height="12" fill="#ff6600"/><rect x="500" y="260" width="12" height="12"/>
    </g>
    <!-- torn misaligned type -->
    <rect x="250" y="560" width="180" height="22" fill="#000" transform="skewX(-12)"/>
    <rect x="260" y="590" width="140" height="14" fill="#ff6600" transform="skewX(8)"/>
    <rect x="270" y="612" width="100" height="10" fill="#000" opacity="0.4" transform="skewX(-5)"/>
  </g>

  <!-- Transformation stream: fragments flowing toward poster -->
  <g opacity="0.5">
    <polygon points="520,400 560,380 580,420 540,440" fill="#ff6600"/>
    <polygon points="560,480 600,460 620,500 580,520" fill="#000"/>
    <polygon points="600,350 640,330 660,370 620,390" fill="#ff6600" opacity="0.7"/>
    <rect x="540" y="520" width="30" height="30" fill="#000" transform="rotate(25 555 535)"/>
    <rect x="620" y="440" width="20" height="20" fill="#ff6600"/>
    <rect x="650" y="380" width="15" height="15" fill="#000"/>
  </g>

  <!-- Main hero poster frame -->
  <rect x="672" y="112" width="536" height="696" fill="#000" rx="6"/>
  <rect x="680" y="120" width="520" height="680" fill="url(#posterGrad)" rx="4"/>

  <!-- Poster content: bold refined design -->
  <g clip-path="url(#posterClip)">
    <!-- Cream geometric hero -->
    <rect x="680" y="120" width="520" height="280" fill="#f5f0e6"/>
    <circle cx="820" cy="260" r="85" fill="#ff6600"/>
    <rect x="920" y="180" width="200" height="160" fill="#000"/>
    <polygon points="920,340 1120,340 1020,260" fill="#ff6600"/>
    <!-- Bold stripes -->
    <rect x="680" y="400" width="520" height="40" fill="#ff6600"/>
    <rect x="680" y="440" width="520" height="60" fill="#000"/>
    <rect x="680" y="500" width="260" height="120" fill="#f5f0e6"/>
    <rect x="940" y="500" width="260" height="120" fill="#ff6600"/>
    <!-- Typography blocks -->
    <rect x="710" y="640" width="340" height="28" fill="#f5f0e6"/>
    <rect x="710" y="678" width="280" height="18" fill="#ff6600"/>
    <rect x="710" y="706" width="200" height="14" fill="#f5f0e6" opacity="0.6"/>
    <rect x="1060" y="640" width="110" height="80" fill="#000"/>
    <circle cx="1115" cy="680" r="22" fill="#ff6600"/>
  </g>

  <!-- Poster frame highlight -->
  <rect x="680" y="120" width="520" height="680" fill="none" stroke="#f5f0e6" stroke-width="3" rx="4" opacity="0.3"/>

  <!-- Right companion poster (smaller, also refined) -->
  <rect x="1240" y="240" width="280" height="380" fill="#000" rx="3"/>
  <rect x="1248" y="248" width="264" height="364" fill="#f5f0e6"/>
  <rect x="1248" y="248" width="264" height="120" fill="#ff6600"/>
  <circle cx="1380" cy="420" r="55" fill="#000"/>
  <rect x="1270" y="500" width="220" height="20" fill="#000"/>
  <rect x="1270" y="530" width="160" height="14" fill="#ff6600"/>
  <rect x="1270" y="555" width="200" height="10" fill="#000" opacity="0.3"/>

  <!-- Foreground figure silhouette viewing art -->
  <g fill="#000">
    <ellipse cx="560" cy="760" rx="55" ry="18" opacity="0.3"/>
    <path d="M530 780 L530 680 Q560 640 590 680 L590 780 Z"/>
    <circle cx="560" cy="655" r="28"/>
    <path d="M500 720 Q480 680 510 660 L530 680" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round"/>
    <path d="M620 720 Q640 680 610 660 L590 680" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Headline typography integrated at bottom -->
  <rect x="0" y="800" width="1600" height="100" fill="#000"/>
  <text x="800" y="862" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#f5f0e6" letter-spacing="1">AI-generated posters don't have to be horrible</text>
  <rect x="680" y="808" width="240" height="4" fill="#ff6600"/>
</svg>
