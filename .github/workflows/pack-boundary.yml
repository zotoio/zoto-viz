name: pack-boundary

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  pack-boundary:
    runs-on: ubuntu-latest
    steps:
      # Base ref only — never checkout or fetch the PR head (HEAD_SHA is API-only below).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Log checked-out base revision
        env:
          PACK_BOUNDARY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "pack-boundary: checked out PR base ref only (no PR head checkout or git fetch)."
          echo "pack-boundary: git HEAD=$(git rev-parse HEAD) (current base branch tip; may differ from pull_request.base.sha if main moved — expected)"
          echo "pack-boundary: pull_request.base.sha=${PACK_BOUNDARY_BASE_SHA}"
      - name: Enforce pack PR boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACK_BOUNDARY_EVENT_ACTION: ${{ github.event.action }}
          PACK_BOUNDARY_EVENT_LABEL_NAME: ${{ github.event.label.name }}
          PACK_BOUNDARY_EVENT_LABEL_CREATED_AT: ${{ github.event.pull_request.updated_at }}
        run: python3 scripts/check_pack_pr_boundary.py --from-github-api
