name: pack-boundary

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  pack-boundary:
    runs-on: ubuntu-latest
    steps:
      # Base ref only (default for pull_request_target). Never checkout the PR head.
      - uses: actions/checkout@v4
      - name: Enforce pack PR boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACK_BOUNDARY_EVENT_ACTION: ${{ github.event.action }}
          PACK_BOUNDARY_EVENT_LABEL_NAME: ${{ github.event.label.name }}
          PACK_BOUNDARY_EVENT_LABEL_CREATED_AT: ${{ github.event.label.created_at }}
        run: python3 scripts/check_pack_pr_boundary.py --from-github-api
