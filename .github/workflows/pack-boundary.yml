name: pack-boundary

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pack-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Pack lint and host boundary baseline
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
          pnpm exec vitest run src/plugins/pack-lint.test.ts
      - name: Enforce pack PR boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! git show "${{ github.event.pull_request.base.sha }}:scripts/check_pack_pr_boundary.py" \
            > /tmp/check_pack_pr_boundary.py 2>/dev/null; then
            cp scripts/check_pack_pr_boundary.py /tmp/check_pack_pr_boundary.py
          fi
          python3 /tmp/check_pack_pr_boundary.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"
