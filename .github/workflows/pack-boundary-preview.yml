name: pack-boundary-preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

# Cost controls (2026-10-23): PR-only; a newer event on the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  informational-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Preview (informational — not a required check)
        run: |
          echo "pack-boundary-preview: informational only."
          echo "Branch protection must require the pack-boundary workflow (pull_request_target), not this job."
