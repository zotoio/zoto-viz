name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cursor-bridge deps
        working-directory: service/cursor-bridge
        run: pnpm install
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt pytest
          pytest tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps for vitest integration tests
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Web tests and coverage
        working-directory: web
        run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Viz dogfood gates
        working-directory: web
        run: pnpm dogfood

  docs:
    if: false # TEMP: prove test gate fails on skipped needs job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Docs
        working-directory: docs
        run: |
          pnpm install
          pnpm approve-builds esbuild
          pnpm build

  # Branch protection requires this check name (workflow ci, job test).
  test:
    runs-on: ubuntu-latest
    needs: [python, web, build, dogfood, docs]
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "One or more CI jobs did not succeed (expected every needs.*.result == success)."
            exit 1
          fi
