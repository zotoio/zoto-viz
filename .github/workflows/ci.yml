name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cursor-bridge deps
        working-directory: service/cursor-bridge
        run: pnpm install
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt pytest
          pytest tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps for vitest integration tests
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Web tests and coverage
        working-directory: web
        run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Viz dogfood gates
        working-directory: web
        run: pnpm dogfood

  backrooms-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps for monitor backend
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build
      - name: Backrooms browser smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          bash scripts/dev.sh start backend
          cd web && pnpm exec playwright install chromium
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:backrooms-smoke
          bash ../scripts/dev.sh stop backend

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps for monitor backend
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build
      - name: Sandbox plugin draw smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          bash scripts/dev.sh start backend
          cd web && pnpm exec playwright install chromium
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:sandbox-plugin-smoke
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:sandbox-draws-smoke
          bash ../scripts/dev.sh stop backend

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Docs
        working-directory: docs
        run: |
          pnpm install
          pnpm approve-builds esbuild
          pnpm build

  # Branch protection requires this check name (workflow ci, job test).
  test:
    runs-on: ubuntu-latest
    needs: [python, web, build, dogfood, backrooms-smoke, sandbox-smoke, docs]
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        run: |
          set -euo pipefail
          declare -A results=(
            [python]="${{ needs.python.result }}"
            [web]="${{ needs.web.result }}"
            [build]="${{ needs.build.result }}"
            [dogfood]="${{ needs.dogfood.result }}"
            [backrooms-smoke]="${{ needs.backrooms-smoke.result }}"
            [sandbox-smoke]="${{ needs.sandbox-smoke.result }}"
            [docs]="${{ needs.docs.result }}"
          )
          failed=0
          for job in python web build dogfood backrooms-smoke sandbox-smoke docs; do
            status="${results[$job]}"
            echo "$job: $status"
            if [ "$status" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
