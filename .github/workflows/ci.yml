name: ci

# Cost controls (2026-10-23): push CI only on main; other branches run via their PR.
# Older in-flight runs on the same PR/branch are cancelled (never on main).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap change detection. Skips draft PRs entirely and skips the heavy jobs on
  # docs-only changes (docs/**, root *.md, LICENSE) while the `test` gate still reports.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null)"; then
            echo "No usable base; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$)' >/dev/null; then
            echo "Docs-only change; skipping code jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            service/cursor-bridge/pnpm-lock.yaml
      - name: Install cursor-bridge deps
        working-directory: service/cursor-bridge
        run: pnpm install
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt pytest
          python scripts/check_ci_test_needs.py .github/workflows/ci.yml
          pytest tests

  web:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python deps for vitest integration tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Playwright Chromium (media-ask focus, starter pack smoke)
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps
      - name: Revert-proof self-test (head runner, head tests)
        run: bash scripts/revert-proof-ci-selftest.sh head
      - name: Revert-proof self-test (head runner, base tests)
        if: github.event_name == 'pull_request'
        run: bash scripts/revert-proof-ci-selftest.sh base "${{ github.event.pull_request.base.sha }}"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: "148.0.7778.96"
      - name: Brand cast lint (FrameTs guard)
        working-directory: web
        run: pnpm lint
      - name: Web tests and coverage
        working-directory: web
        env:
          ZOTO_VIZ_EXPECT_RENDERER: swiftshader
          PACK_MIRROR_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:coverage

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build
      - name: Prod bundle guard (vizWallClock stripped)
        working-directory: web
        env:
          VIZ_REQUIRE_DIST: "1"
        run: pnpm exec vitest run src/core/viz-dev-wall-flags.test.ts -t "prod bundle"

  dogfood:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Viz dogfood gates
        working-directory: web
        run: pnpm dogfood

  backrooms-smoke:
    # Expensive browser smokes only after the cheap gates pass.
    needs: [changes, python, build, web, dogfood]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python deps for monitor backend
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build
      - name: Backrooms browser smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb iproute2
          bash scripts/dev.sh start backend
          cd web && pnpm exec playwright install chromium
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:backrooms-smoke
          bash ../scripts/dev.sh stop backend

  sandbox-smoke:
    # Expensive browser smokes only after the cheap gates pass.
    needs: [changes, python, build, web, dogfood]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python deps for monitor backend
        run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps
        working-directory: web
        run: |
          pnpm install
          pnpm approve-builds esbuild
      - name: Typecheck and production build
        working-directory: web
        run: pnpm build
      - name: Sandbox plugin draw smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb iproute2
          bash scripts/dev.sh start backend
          cd web && pnpm exec playwright install chromium
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:sandbox-plugin-smoke
          xvfb-run -a env ZOTO_VIZ_URL=http://127.0.0.1:7020/ pnpm test:sandbox-draws-smoke
          bash ../scripts/dev.sh stop backend

  docs:
    needs: changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Docs
        working-directory: docs
        run: |
          pnpm install
          pnpm approve-builds esbuild
          pnpm build

  # Branch protection requires this check name (workflow ci, job test).
  test:
    runs-on: ubuntu-latest
    needs: [changes, python, web, build, dogfood, backrooms-smoke, sandbox-smoke, docs]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          if [ -z "$NEEDS_JSON" ] || [ "$NEEDS_JSON" = "null" ] || [ "$NEEDS_JSON" = "{}" ]; then
            echo "needs is empty"
            exit 1
          fi
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped is OK only when intentional: draft PR (changes skipped) or docs-only
          # (code == false). Any failure/cancel fails the gate; when code == true every
          # job must succeed (an upstream failure also skips downstream jobs).
          if echo "$NEEDS_JSON" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          if [ "${CODE_CHANGED}" = "true" ] && ! echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "Code changed but not every CI job succeeded."
            exit 1
          fi
          echo "Gate passed (code changed: ${CODE_CHANGED:-n/a})."
