<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Android 17 is the first since 3.x to add new APIs without releasing to the AOSP">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="45%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="72%" r="55%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ff6600" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#horizonGlow)"/>

    <!-- distant planetary horizon -->
    <ellipse cx="800" cy="780" rx="920" ry="280" fill="#000000" opacity="0.22"/>
    <path d="M0 640 L180 590 L360 620 L520 560 L720 600 L920 540 L1120 580 L1320 530 L1500 570 L1600 550 L1600 900 L0 900 Z" fill="#0a0a0a" opacity="0.28"/>
    <path d="M0 710 L240 670 L480 695 L720 650 L960 680 L1200 640 L1440 670 L1600 655 L1600 900 L0 900 Z" fill="#000000" opacity="0.55"/>

    <!-- orbital arc — version timeline -->
    <path d="M120 720 Q800 420 1480 720" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <path d="M120 720 Q800 420 1480 720" fill="none" stroke="#ff6600" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 14" opacity="0.85"/>

    <!-- 3.x marker -->
    <g transform="translate(200 695)">
      <circle cx="0" cy="0" r="36" fill="#000000"/>
      <circle cx="0" cy="0" r="24" fill="#f5f0e6"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#000000">3.x</text>
      <text x="0" y="-52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" letter-spacing="2">AOSP ERA</text>
    </g>

    <!-- 17 marker -->
    <g transform="translate(1400 695)">
      <circle cx="0" cy="0" r="44" fill="#ff6600"/>
      <circle cx="0" cy="0" r="28" fill="#000000"/>
      <text x="0" y="9" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#f5f0e6">17</text>
      <circle cx="0" cy="0" r="70" fill="url(#coreGlow)" opacity="0.5" filter="url(#soft)"/>
    </g>

    <!-- central android monolith -->
    <g transform="translate(800 310)">
      <rect x="-110" y="-85" width="220" height="170" rx="48" fill="#ff6600"/>
      <circle cx="-52" cy="-12" r="22" fill="#f5f0e6"/>
      <circle cx="52" cy="-12" r="22" fill="#f5f0e6"/>
      <rect x="-132" y="-112" width="28" height="58" rx="10" fill="#ff6600"/>
      <rect x="104" y="-112" width="28" height="58" rx="10" fill="#ff6600"/>
      <rect x="-70" y="62" width="140" height="10" rx="5" fill="#000000" opacity="0.35"/>
      <circle cx="0" cy="0" r="160" fill="url(#coreGlow)" opacity="0.35" filter="url(#soft)"/>
    </g>

    <!-- proprietary vault — APIs sealed above AOSP -->
    <g transform="translate(800 500)">
      <rect x="-280" y="-95" width="560" height="190" rx="8" fill="url(#vault)" stroke="#ff6600" stroke-width="10"/>
      <rect x="-240" y="-55" width="90" height="62" fill="#ff6600"/>
      <rect x="-120" y="-55" width="90" height="62" fill="#f5f0e6"/>
      <rect x="0" y="-55" width="90" height="62" fill="#ff6600"/>
      <rect x="120" y="-55" width="90" height="62" fill="#000000" stroke="#ff6600" stroke-width="4"/>
      <text x="0" y="55" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#f5f0e6" letter-spacing="5">NEW APIs</text>
      <!-- lock -->
      <rect x="-24" y="-130" width="48" height="38" rx="6" fill="#ff6600"/>
      <path d="M -16 -130 Q -16 -158 0 -158 Q 16 -158 16 -130" fill="none" stroke="#ff6600" stroke-width="9"/>
    </g>

    <!-- AOSP cut off below -->
    <g transform="translate(800 680)">
      <rect x="-320" y="0" width="640" height="78" fill="#000000"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#f5f0e6" letter-spacing="8">AOSP</text>
      <line x1="-380" y1="-18" x2="380" y2="96" stroke="#ff6600" stroke-width="18" stroke-linecap="round"/>
      <line x1="380" y1="-18" x2="-380" y2="96" stroke="#ff6600" stroke-width="18" stroke-linecap="round"/>
      <text x="0" y="-36" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ff6600" letter-spacing="3">NOT RELEASED</text>
    </g>

    <!-- data stream breaking at the wall -->
    <g stroke="#ff6600" stroke-width="5" fill="none" opacity="0.8">
      <path d="M420 420 L620 480 L720 520"/>
      <path d="M1180 420 L980 480 L880 520"/>
      <path d="M520 380 L680 440 L760 490" opacity="0.5"/>
      <path d="M1080 380 L920 440 L840 490" opacity="0.5"/>
    </g>
    <rect x="770" y="505" width="60" height="14" fill="#ff6600" opacity="0.9"/>

    <!-- headline band -->
    <rect x="0" y="0" width="1600" height="130" fill="#000000" opacity="0.88"/>
    <text x="800" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#f5f0e6" letter-spacing="2">ANDROID 17</text>
    <text x="800" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6600">first since 3.x to add new APIs without releasing to the AOSP</text>

    <!-- APOD corner marks -->
    <g fill="#ff6600">
      <rect x="36" y="148" width="56" height="8"/>
      <rect x="36" y="148" width="8" height="56"/>
      <rect x="1508" y="148" width="56" height="8"/>
      <rect x="1556" y="148" width="8" height="56"/>
      <rect x="36" y="836" width="56" height="8"/>
      <rect x="36" y="788" width="8" height="56"/>
      <rect x="1508" y="836" width="56" height="8"/>
      <rect x="1556" y="788" width="8" height="56"/>
    </g>

    <!-- sparse stars -->
    <g fill="#f5f0e6" opacity="0.75">
      <circle cx="140" cy="200" r="2"/>
      <circle cx="320" cy="260" r="1.5"/>
      <circle cx="560" cy="180" r="2.5"/>
      <circle cx="1040" cy="210" r="2"/>
      <circle cx="1280" cy="170" r="1.5"/>
      <circle cx="1480" cy="240" r="2"/>
    </g>
    <g fill="#ff6600" opacity="0.85">
      <circle cx="240" cy="340" r="3"/>
      <circle cx="1360" cy="320" r="2.5"/>
      <circle cx="1100" cy="420" r="2"/>
    </g>
  </g>
</svg>
