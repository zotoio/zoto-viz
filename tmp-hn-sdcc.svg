<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ff6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#f5f0dc" opacity="0.7">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="340" cy="140" r="1"/>
    <circle cx="580" cy="60" r="1.2"/>
    <circle cx="890" cy="110" r="1"/>
    <circle cx="1120" cy="75" r="1.5"/>
    <circle cx="1380" cy="130" r="1"/>
    <circle cx="1520" cy="55" r="1.2"/>
    <circle cx="210" cy="220" r="0.8"/>
    <circle cx="1450" cy="240" r="0.8"/>
    <circle cx="75" cy="380" r="1"/>
    <circle cx="1540" cy="420" r="1"/>
    <circle cx="180" cy="650" r="0.8"/>
    <circle cx="1480" cy="700" r="1"/>
    <circle cx="720" cy="820" r="0.8"/>
    <circle cx="960" cy="850" r="1"/>
  </g>

  <!-- Orbital ring -->
  <ellipse cx="800" cy="420" rx="620" ry="280" fill="none" stroke="#f5f0dc" stroke-width="2" opacity="0.12"/>
  <ellipse cx="800" cy="420" rx="520" ry="235" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 16"/>

  <!-- Code rays -->
  <g stroke="#ff6600" stroke-width="3" opacity="0.5">
    <line x1="800" y1="420" x2="200" y2="180"/>
    <line x1="800" y1="420" x2="1400" y2="200"/>
    <line x1="800" y1="420" x2="1500" y2="500"/>
    <line x1="800" y1="420" x2="100" y2="520"/>
    <line x1="800" y1="420" x2="800" y2="60"/>
    <line x1="800" y1="420" x2="800" y2="820"/>
  </g>

  <!-- Floating code fragments -->
  <g font-family="monospace" font-weight="bold" fill="#f5f0dc" opacity="0.35">
    <text x="160" y="200" font-size="28">int main()</text>
    <text x="1180" y="170" font-size="24">{</text>
    <text x="1300" y="320" font-size="22">return 0;</text>
    <text x="90" y="580" font-size="26">#include</text>
    <text x="1350" y="620" font-size="24">8051</text>
    <text x="200" y="780" font-size="20">void</text>
    <text x="1280" y="780" font-size="22">asm</text>
  </g>

  <!-- Central chip glow -->
  <circle cx="800" cy="420" r="220" fill="url(#chipGlow)" filter="url(#softGlow)"/>

  <!-- Microcontroller body -->
  <g transform="translate(800,420)">
    <!-- PCB traces background -->
    <rect x="-280" y="-180" width="560" height="360" rx="8" fill="#0d0d0d" stroke="#f5f0dc" stroke-width="3" opacity="0.9"/>
    <g stroke="#ff6600" stroke-width="2" opacity="0.4" fill="none">
      <path d="M-260,-160 L-180,-160 L-180,-100 L-100,-100"/>
      <path d="M260,160 L180,160 L180,100 L100,100"/>
      <path d="M-260,160 L-200,160 L-200,80"/>
      <path d="M260,-160 L200,-160 L200,-80"/>
    </g>

    <!-- Main chip package -->
    <rect x="-120" y="-120" width="240" height="240" rx="6" fill="#111111" stroke="#f5f0dc" stroke-width="4"/>
    <rect x="-100" y="-100" width="200" height="200" rx="4" fill="#0a0a0a"/>

    <!-- Die -->
    <rect x="-70" y="-70" width="140" height="140" rx="2" fill="#ff6600" opacity="0.15"/>
    <rect x="-55" y="-55" width="110" height="110" fill="#1a1a1a" stroke="#ff6600" stroke-width="2"/>

    <!-- Die circuit pattern -->
    <g stroke="#ff6600" stroke-width="1.5" fill="none" opacity="0.8">
      <rect x="-40" y="-40" width="80" height="80"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="40" y1="-40" x2="-40" y2="40"/>
      <circle cx="0" cy="0" r="12" fill="#ff6600" stroke="none" opacity="0.9"/>
    </g>

    <!-- C letter on die -->
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#f5f0dc">C</text>

    <!-- Pin rows -->
    <g fill="#f5f0dc">
      <!-- Left pins -->
      <rect x="-140" y="-100" width="20" height="8" rx="1"/>
      <rect x="-140" y="-70" width="20" height="8" rx="1"/>
      <rect x="-140" y="-40" width="20" height="8" rx="1"/>
      <rect x="-140" y="-10" width="20" height="8" rx="1"/>
      <rect x="-140" y="20" width="20" height="8" rx="1"/>
      <rect x="-140" y="50" width="20" height="8" rx="1"/>
      <rect x="-140" y="80" width="20" height="8" rx="1"/>
      <!-- Right pins -->
      <rect x="120" y="-100" width="20" height="8" rx="1"/>
      <rect x="120" y="-70" width="20" height="8" rx="1"/>
      <rect x="120" y="-40" width="20" height="8" rx="1"/>
      <rect x="120" y="-10" width="20" height="8" rx="1"/>
      <rect x="120" y="20" width="20" height="8" rx="1"/>
      <rect x="120" y="50" width="20" height="8" rx="1"/>
      <rect x="120" y="80" width="20" height="8" rx="1"/>
      <!-- Top pins -->
      <rect x="-70" y="-140" width="8" height="20" rx="1"/>
      <rect x="-40" y="-140" width="8" height="20" rx="1"/>
      <rect x="-10" y="-140" width="8" height="20" rx="1"/>
      <rect x="20" y="-140" width="8" height="20" rx="1"/>
      <rect x="50" y="-140" width="8" height="20" rx="1"/>
      <!-- Bottom pins -->
      <rect x="-70" y="120" width="8" height="20" rx="1"/>
      <rect x="-40" y="120" width="8" height="20" rx="1"/>
      <rect x="-10" y="120" width="8" height="20" rx="1"/>
      <rect x="20" y="120" width="8" height="20" rx="1"/>
      <rect x="50" y="120" width="8" height="20" rx="1"/>
    </g>

    <!-- Orange pin highlights -->
    <g fill="#ff6600">
      <rect x="-140" y="-10" width="20" height="8" rx="1"/>
      <rect x="120" y="20" width="20" height="8" rx="1"/>
      <rect x="20" y="-140" width="8" height="20" rx="1"/>
      <rect x="-10" y="120" width="8" height="20" rx="1"/>
    </g>

    <!-- Chip label -->
    <text x="0" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ff6600" letter-spacing="3">SDCC</text>
  </g>

  <!-- Small satellite devices -->
  <g transform="translate(280,320)">
    <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#111" stroke="#f5f0dc" stroke-width="2"/>
    <rect x="-50" y="-5" width="20" height="10" fill="#f5f0dc"/>
    <rect x="30" y="-5" width="20" height="10" fill="#f5f0dc"/>
    <circle cx="0" cy="0" r="6" fill="#ff6600"/>
  </g>
  <g transform="translate(1320,340)">
    <rect x="-25" y="-25" width="50" height="50" rx="4" fill="#111" stroke="#ff6600" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#f5f0dc">Z80</text>
  </g>
  <g transform="translate(350,620)">
    <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#111" stroke="#f5f0dc" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ff6600">PIC</text>
  </g>
  <g transform="translate(1250,600)">
    <rect x="-28" y="-18" width="56" height="36" rx="2" fill="#111" stroke="#f5f0dc" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#f5f0dc">AVR</text>
  </g>

  <!-- Connection lines to satellites -->
  <g stroke="#f5f0dc" stroke-width="1.5" opacity="0.2" fill="none" stroke-dasharray="4 6">
    <line x1="520" y1="400" x2="310" y2="320"/>
    <line x1="1080" y1="400" x2="1295" y2="340"/>
    <line x1="520" y1="460" x2="372" y2="598"/>
    <line x1="1080" y1="460" x2="1222" y2="582"/>
  </g>

  <!-- Bottom horizon glow -->
  <ellipse cx="800" cy="920" rx="700" ry="120" fill="#ff6600" opacity="0.08"/>

  <!-- Title block - NASA caption style -->
  <rect x="0" y="760" width="1600" height="140" fill="#000000" opacity="0.75"/>
  <rect x="0" y="760" width="8" height="140" fill="#ff6600"/>

  <text x="40" y="810" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#f5f0dc">SDCC – Small Device C Compiler</text>
  <text x="40" y="855" font-family="Georgia, serif" font-size="22" fill="#ff6600" opacity="0.9">Retargetable ANSI-C compiler for 8051, Z80, HC08, PIC, AVR and more</text>
  <text x="40" y="885" font-family="monospace" font-size="16" fill="#f5f0dc" opacity="0.5">Image Credit: Embedded Systems Observatory</text>

  <!-- Accent corner marks -->
  <g stroke="#ff6600" stroke-width="3" fill="none" opacity="0.6">
    <path d="M30,30 L30,70 M30,30 L70,30"/>
    <path d="M1570,30 L1570,70 M1570,30 L1530,30"/>
    <path d="M30,870 L30,830 M30,870 L70,870"/>
    <path d="M1570,870 L1570,830 M1570,870 L1530,870"/>
  </g>
</svg>
