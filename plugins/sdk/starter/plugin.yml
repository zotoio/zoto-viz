id: pack-starter-template
name: Pack starter
version: 1
hint: Copy to plugins/src/<your-id>/ and follow plugins/sdk/starter/README.md.
capabilities:
  - viz.read
  - viz.write
  - config.read
viz:
  graphWalk: false
  maxBuffers: 2
  maxBufferFloats: 32
  maxParticles: 0
  uniforms:
    - uTime
    - uBright
    - uAccent
    - uBg
    - uOpacity
  idle:
    fixture: host
config:
  - key: displayName
    label: Display name
    type: string
    default: Starter
frontend:
  entry: frontend/index.ts
