# Declared VizDataFrame → starter effects (legend is generated from this list).
mappings:
  - field: talkers[].rate
    effect: bar height; rate-ranked slots (sdk talker-slots)
  - field: talkers[].id
    effect: stable slot identity
  - field: sys.failed
    effect: failure wash strength (idle vs idle-failed must differ)
  - field: demo
    effect: corner chip demo marker
