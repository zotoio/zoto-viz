engine: graph
base: talkers
idle:
  fixture: host
look:
  theme: zen
  backdrop: plugin
  stageOnly: true
  skyOpacity: 1
  skyBright: 1.05
  skyAudio: true
  skySpeed: 0.45
  gridOpacity: 0
  mosaic: "off"
config:
  - key: preset
    label: preset
    type: select
    values:
      - [zen_garden, Zen Garden]
      - [moonlit_lotus, Moonlit Lotus]
      - [sunrise_feed, Sunrise Feed]
      - [storm_ripples, Storm Ripples]
      - [festival_lanterns, Festival Lanterns]
    default: zen_garden
    hint: Preset sets water, lotus, and motion baselines for every tile on the wall.
  - key: randomise
    label: randomise settings
    type: boolean
    default: false
    hint: Randomise seed and decor (undo restores the previous seed).
  - key: undoRandom
    label: undo randomise
    type: boolean
    default: false
    hint: Restore the seed from before the last randomise.
  - key: resetSettings
    label: reset to preset defaults
    type: boolean
    default: false
    hint: Reset all knobs to the selected preset defaults.
  - key: koiCap
    label: koi count cap
    type: number
    default: 12
    min: 2
    max: 16
    step: 1
    hint: Maximum talker koi (quality preset may clamp lower).
  - key: koiSize
    label: koi size scale
    type: number
    default: 1
    min: 0.5
    max: 1.8
    step: 0.05
    hint: Body scale from traffic vigor baseline.
  - key: varietyMix
    label: pattern variety
    type: number
    default: 0.65
    min: 0
    max: 1
    step: 0.05
    hint: How often pattern assignment rotates across enabled varieties.
  - key: swimSpeed
    label: swim speed
    type: number
    default: 0.55
    min: 0
    max: 1
    step: 0.05
    hint: Global swim speed multiplier.
  - key: schooling
    label: schooling vs wandering
    type: number
    default: 0.45
    min: 0
    max: 1
    step: 0.05
    hint: Left = loose wander; right = tight schooling at pads.
  - key: lilyDensity
    label: lily pad density
    type: number
    default: 0.7
    min: 0
    max: 1
    step: 0.05
    hint: Pad count across the pond surface.
  - key: lotusCount
    label: lotus count
    type: number
    default: 4
    min: 0
    max: 8
    step: 1
    hint: Lotus destinations (subset of pads).
  - key: lotusColour
    label: lotus bloom colour
    type: select
    values:
      - [pink, pink]
      - [white, white]
      - [mixed, mixed]
    default: mixed
    hint: Bloom palette for lotus flowers.
  - key: bloomOnActivity
    label: bloom on activity
    type: boolean
    default: true
    hint: Lotus bloom follows pond-wide total traffic rate (legend chip).
  - key: waterTint
    label: water tint
    type: number
    default: 0.42
    min: 0
    max: 1
    step: 0.05
    hint: Green–teal water colour bias.
  - key: waterClarity
    label: water clarity
    type: number
    default: 0.72
    min: 0
    max: 1
    step: 0.05
    hint: Murk from SYS failure reduces clarity automatically.
  - key: rippleIntensity
    label: ripple intensity
    type: number
    default: 0.65
    min: 0
    max: 1
    step: 0.05
    hint: Packet and surface ripple strength.
  - key: caustics
    label: caustics
    type: boolean
    default: true
    hint: Animated caustic light on the pond floor.
  - key: causticStrength
    label: caustic strength
    type: number
    default: 0.55
    min: 0
    max: 1
    step: 0.05
    hint: Caustic brightness when enabled.
  - key: petalDrift
    label: petal drift
    type: boolean
    default: true
    hint: Cherry petals drifting on the surface.
  - key: dragonflies
    label: dragonflies
    type: boolean
    default: true
    hint: Optional dragonflies skimming the pond.
  - key: timeOfDay
    label: time of day
    type: select
    values:
      - [dawn, dawn]
      - [day, day]
      - [dusk, dusk]
      - [night, night lanterns]
    default: day
    hint: Sky and lantern lighting preset.
  - key: rain
    label: rain
    type: boolean
    default: false
    hint: Gentle rain ripples on the surface.
  - key: cameraAngle
    label: camera angle
    type: select
    values:
      - [top, top-down]
      - [angled, angled]
    default: angled
    hint: Viewing angle over the pond.
  - key: cameraDrift
    label: camera drift
    type: boolean
    default: true
    hint: Slow camera drift (disabled with reduced motion).
  - key: label
    label: HUD label
    type: boolean
    default: true
    hint: On-tile pack label and metric (demo when simulated).
  - key: legend
    label: pattern legend
    type: boolean
    default: true
    hint: Corner chips for koi patterns plus lotus bloom = total traffic rate (2×2 / 4×4 safe).
  - key: quality
    label: quality
    type: select
    values:
      - [low, low]
      - [medium, medium]
      - [high, high]
    default: medium
    hint: Scales particles and shader march steps.
  - key: seed
    label: seed
    type: number
    default: 5150
    min: 0
    max: 99999
    step: 1
    hint: Pad layout and school phase.
  - key: reducedMotion
    label: reduced motion
    type: boolean
    default: false
    hint: No camera drift, calmer swim, static ripples.
  - key: pat_kohaku
    label: kohaku
    type: boolean
    default: true
  - key: pat_sanke
    label: sanke
    type: boolean
    default: true
  - key: pat_showa
    label: showa
    type: boolean
    default: true
  - key: pat_ogon
    label: ogon
    type: boolean
    default: true
  - key: pat_tancho
    label: tancho
    type: boolean
    default: true
  - key: pat_asagi
    label: asagi
    type: boolean
    default: true
  - key: modelGlb
    label: designer model (GLB)
    type: text
    default: "host"
    hint: host = ZotoDesigner GLB lane; procedural = shader-only; or assets/foo.glb path.
