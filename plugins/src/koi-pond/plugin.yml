id: koi-pond
name: Koi Pond
version: 1
hint: Tranquil pond — talkers are koi, destinations are lily pads and lotus blooms.
description: >-
  Koi pond with a Blender scape (basin, kerb, fountain, flowering lilies, rocks), skinned host-mesh koi, reflective water, and an occasional follow camera. Data mapping is declared in
  data-mapping.yml (talkers→koi, packets→ripples, sys.failed→murk).
  Talkers map to koi by id with #22 slot hysteresis; roles pick colour patterns;
  packet events spawn ripples. Endpoints
  appear as lily pads and lotus flowers that open with activity. SYS failures
  tint the water murky with a steady corner fail chip (no flashing).
  Work budget: raymarch steps ≤68, koi ≤16, pads ≤14, particles ≤36, 1 draw call.
  Demo schools when the host idle fixture is active — label shows demo.
capabilities:
  - viz.read
  - viz.write
  - config.read
