id: backrooms
name: Backrooms
version: 38
hint: Level 0 yellow halls. A skinny thing walks the hall at you; when it gets close the cam cuts 90° and keeps running forward.
description: Found-footage jog through damp yellow halls. A skinny creature stays on the path and walks toward the lens. When it is close the runner cuts into a side hall and keeps running forward — never reversing down the same corridor. Speed rises on the sprint. After that the runner pants; fluorescent tubes buzz; the thing screeches now and then.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  idle:
    fixture: host
  maxBuffers: 1
  maxBufferFloats: 8
  maxParticles: 0
  uniforms:
    - uTime
    - uAudio
    - uAccent
    - uBg
    - uBright
    - uOpacity
frontend:
  entry: frontend/index.ts
