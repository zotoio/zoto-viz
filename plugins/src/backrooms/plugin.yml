id: backrooms
name: Backrooms
version: 31
hint: Level 0 yellow halls and a few wide empty rooms. When the walker is seen it charges; the cam stops, turns, and sprints the other way.
description: Found-footage run through damp yellow halls. Far down the corridor a tall thing walks the floor. The moment it is visible it runs at the camera. The cam stops, turns, and sprints the other way, sometimes checking a side hall.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  idle:
    fixture: host
  maxBuffers: 1
  maxBufferFloats: 8
  maxParticles: 0
  uniforms:
    - uTime
    - uAudio
    - uAccent
    - uBg
    - uBright
    - uOpacity
frontend:
  entry: frontend/index.ts
