id: backrooms
name: Backrooms
version: 48
hint: Level 0 yellow halls, horizon look to the vanishing point. Long-legged thing grins from a pillar, then staggers in with bendy knees and arms out. Cam freezes, cuts 90° at a junction. Tube buzz and entity scream (sound on).
description: Found-footage jog through damp yellow halls. The runner stays on hall centerlines and only turns at junctions — never through a wall. A long-legged creature can lean a toothy grin from a pillar, then stagger toward you with buckling knees and arms outstretched. That freeze is the beat — then the runner cuts into a side hall and keeps going forward. Fluorescent buzz and creature vocals are recorded CC0 samples (header sound must be on).
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  idle:
    fixture: host
  maxBuffers: 1
  maxBufferFloats: 8
  maxParticles: 0
  uniforms:
    - uTime
    - uAudio
    - uAccent
    - uBg
    - uBright
    - uOpacity
frontend:
  entry: frontend/index.ts
