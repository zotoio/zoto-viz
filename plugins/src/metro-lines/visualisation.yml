engine: graph
base: talkers
look:
  theme: paper
  backdrop: plugin
  stageOnly: true
  skyOpacity: 1
  skyBright: 1.05
  skyAudio: false
  skySpeed: 0.12
  gridOpacity: 0
config:
  - key: preset
    label: preset
    type: select
    default: classic_map
    hint: Bundled looks — overrides several knobs below until you change them.
    values:
      - [classic_map, Classic Map]
      - [night_network, Night Network]
      - [disruptions_only, Disruptions Only]
      - [minimal, Minimal]
  - key: seed
    label: layout seed
    type: number
    default: 4242
    min: 0
    max: 99999
    step: 1
    hint: Pinned deterministic layout and train phasing.
  - key: palette
    label: palette
    type: select
    default: aurora
    values:
      - [aurora, Aurora]
      - [citrus, Citrus]
      - [slate, Slate]
      - [neon, Neon]
    hint: Line colour family — independent of real transit brands.
  - key: lineThickness
    label: line thickness
    type: number
    default: 1
    min: 0.5
    max: 2.2
    step: 0.05
  - key: labelDensity
    label: label density
    type: number
    default: 1
    min: 0
    max: 1
    step: 0.05
    hint: Fades minor labels on small tiles (4×4 wall).
  - key: ticker
    label: departure ticker
    type: boolean
    default: true
  - key: trainSpeed
    label: train speed scale
    type: number
    default: 1
    min: 0.25
    max: 3
    step: 0.05
  - key: maxStations
    label: max stations
    type: number
    default: 16
    min: 6
    max: 16
    step: 1
  - key: maxTrains
    label: max trains
    type: number
    default: 48
    min: 8
    max: 48
    step: 1
  - key: tilt3d
    label: 3D tilt
    type: number
    default: 0.35
    min: 0
    max: 1
    step: 0.05
  - key: nightMode
    label: night mode
    type: boolean
    default: false
  - key: stationSource
    label: stations from
    type: select
    default: talkers
    values:
      - [talkers, top talkers]
      - [rf, Wi‑Fi watch list]
      - [mixed, talkers + RF]
  - key: lineSource
    label: lines from
    type: select
    default: packets
    values:
      - [packets, packet flows]
      - [talkers, talker pairs]
  - key: reducedMotion
    label: reduced motion
    type: boolean
    default: false
    hint: Holds a wide still; no camera cuts or shake.
idle:
  fixture: host
