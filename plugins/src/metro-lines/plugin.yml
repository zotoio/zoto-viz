id: metro-lines
name: Metro Lines
version: 1
hint: Living schematic transit map — talkers are stations, schematic spokes to the gateway, packet trains coloured by proto.
description: |
  Classic 45/90° schematic map (legend tile "schematic"). Uses only the shipped VizDataFrame contract.
  Data mapping:
    talkers[].id → station identity and label (keyed by id, not list rank); talkers[].rate → station size and spoke weight; talkers[].role → gateway hub selection.
    packets[].proto → train colour; packets[].size → train length and speed (field is not used for routing).
    Trains are spread across schematic spokes in proportion to station rate, one per packet up to maxTrains.
    sys.failed ≥ banner threshold → network-wide Zoto Fail strip on the departure board (no per-station badges).
    headlines[].text → plain ticker scroll only (never parsed as disruptions).
  Future host contract (not required today): optional links[] with src/dst host ids; optional talkers[].failed for per-station badges.
  Caps: 16 stations, 16 schematic edges, 48 trains, 8×64 buffers. Idle fictional demo when viz.idle fixture is active.
capabilities:
  - viz.read
  - viz.write
  - config.read
viz:
  graphWalk: false
  idle:
    fixture: host
  maxBuffers: 8
  maxBufferFloats: 64
  maxParticles: 192
  uniforms:
    - uTime
    - uOpacity
    - uBright
    - uAudio
    - uAccent
    - uBg
frontend:
  entry: frontend/index.ts
