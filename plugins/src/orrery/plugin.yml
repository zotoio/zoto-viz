id: orrery
name: Orrery
version: 1
hint: A brass clockwork orrery on a walnut study desk — top talkers are planets on geared arms (size is bytes, orbit speed is rate), packets run as sparks through the gear train, and failed units slow the escapement to an uneven tick.
description: >-
  Desk, machine and planet templates are Blender-built GLBs (blender/build_orrery.py: geometry-node
  gears, rings, hairspring and arms over CC0 Poly Haven and ambientCG photo textures, then
  gltfpack -cc -kn -km) drawn by the host mesh lane; the host scenery instances the arms,
  planets and sparks from viz slots 1..3 and turns the named gear nodes from slot 0. The sandbox
  (frontend/orrery.ts) runs the escapement, rate-ranked planet slots with hysteresis, the spark
  pool and the camera. Standard and HD model sets via modelSet. Data mapping is declared in
  visualisation.yml dataMapping (and data-mapping.yml); per-frame caps in workBudget. Idle host
  fixture keeps demo talkers and packets turning the machine.
capabilities:
  - viz.read
  - viz.write
  - config.read
