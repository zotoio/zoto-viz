id: nest-cams
name: Nest cams
version: 1
hint: Google Nest cameras via Device Access. Stays out of dice until OAuth is linked. Setup — https://developers.google.com/nest/device-access and https://console.nest.google.com/device-access. Tokens stay on the host.
description: Stage-only labeled camera wall (1–6 panes). Show / layout / camera chips on the wall and in Settings. Named picks are not padded with extras. Stills follow the same pick. The monitor lists SDM devices, pulls Pub/Sub motion/person events, proxies event JPEGs, and exchanges WebRTC SDP so the browser talks to Nest. Config is ~/.zoto-viz/sdm.yml.
