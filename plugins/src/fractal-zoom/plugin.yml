id: fractal-zoom
name: Fractal Zoom
version: 1
hint: Infinite GPU raymarch into Mandelbulb, Mandelbox, Menger, Sierpinski, quaternion Julia, kaleidoscopic IFS, and 2D Mandelbrot/Julia
  deep zoom. Every knob is in This view.
description: Stage-only procedural fractal flight with smooth infinite zoom, rich palettes, orbit-trap colour, soft shadows,
  glow, fog, optional depth blur, named presets. Renders vivid demo imagery on empty boards (golden host idle). Does not map LAN
  talkers, packets, or host list order to sky regions (no host-id slots). Respects prefers-reduced-motion by defaulting to slow or paused zoom.
capabilities:
- viz.read
- viz.write
- config.read
viz:
  graphWalk: false
  maxBuffers: 1
  maxBufferFloats: 64
  maxParticles: 0
  uniforms:
  - uTime
  - uBright
  - uAudio
  - uAccent
  - uBg
  - uOpacity
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
config:
- key: preset
  label: preset
  type: select
  default: bulb-classic
  values:
  - - bulb-classic
    - Classic Dive
  - - box-abyss
    - Deep Cathedral
  - - menger-tunnel
    - Menger Tunnel
  - - sierpinski-crystal
    - Crystal Spire
  - - julia-quaternion
    - Quaternion Bloom
  - - kaleido-ifs
    - Kaleidoscope
  - - mandel-deep
    - Seahorse Valley
  - - julia-deep
    - Julia Spiral
  - - custom
    - custom
  hint: Named full-option starting points. Random picks a new look once when selected.
  section: Presets
- key: randomise
  label: randomise
  type: select
  default: hold
  values:
  - - hold
    - hold
  - - roll
    - randomise
  hint: Roll all fractal parameters to new random values.
  section: Presets
- key: undo
  label: undo
  type: select
  default: hold
  section: Presets
  values:
  - - hold
    - hold
  - - go
    - undo
  hint: Step back after randomise.
- key: resetPreset
  label: reset to preset
  type: select
  default: hold
  section: Presets
  values:
  - - hold
    - hold
  - - go
    - reset
  hint: Restore all fields from the selected preset.
- key: fractalType
  label: fractal type
  type: select
  default: mandelbulb
  values:
  - - mandelbulb
    - Mandelbulb
  - - mandelbox
    - Mandelbox
  - - menger
    - Menger sponge
  - - sierpinski
    - Sierpinski tetrahedron
  - - julia4d
    - Julia quaternion
  - - kaleido
    - Kaleidoscopic IFS
  - - mandel2d
    - Mandelbrot 2D deep zoom
  - - julia2d
    - Julia 2D deep zoom
  section: Fractal
- key: zoomSpeed
  label: zoom speed
  type: number
  default: 0.35
  min: 0
  max: 1.0
  step: 0.05
  hint: Forward flight speed into the set. Lower when motion-sensitive.
  section: Camera and zoom
- key: zoomDir
  label: zoom direction
  type: select
  default: in
  values:
  - - in
    - fly in
  - - out
    - fly out
  - - pingpong
    - ping-pong
  section: Camera and zoom
- key: autoPilot
  label: auto-pilot
  type: boolean
  default: true
  hint: Drift toward interesting boundary coordinates while zooming.
  section: Camera and zoom
- key: paused
  label: pause zoom
  type: boolean
  default: false
  section: Camera and zoom
- key: resetCam
  label: reset camera
  type: boolean
  default: false
  hint: Toggle on to snap back to the default camera pose.
  section: Camera and zoom
- key: maxIter
  label: max iterations
  type: number
  default: 32
  min: 4
  max: 32
  step: 4
  section: Lighting and fog
- key: maxSteps
  label: raymarch steps
  type: number
  default: 32
  min: 12
  max: 48
  step: 4
  section: Lighting and fog
- key: detail
