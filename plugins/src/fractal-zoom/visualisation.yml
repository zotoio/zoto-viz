engine: graph
base: talkers
idle:
  fixture: host
look:
  theme: ember
  backdrop: plugin
  stageOnly: true
  skyOpacity: 1
  skyBright: 1.15
  skyAudio: false
  skySpeed: 1
  gridOpacity: 0
  mosaic: 'off'
settings:
  presetField: preset
  hud:
    labelFields: [fractalType, preset]
  sections:
    - title: Fractal
    - title: Camera and zoom
      collapsed: true
    - title: Quality and lighting
      collapsed: true
  presets:
    - id: bulb-classic
      label: Classic Dive
      values: { preset: bulb-classic, fractalType: mandelbulb, power: 8, palette: cosmic, zoomSpeed: 0.55, glow: 0.35, fog: 0.2, morph: true }
    - id: box-abyss
      label: Deep Cathedral
      values: { preset: box-abyss, fractalType: mandelbox, scale: 2.1, fold: 0.55, palette: ember, zoomSpeed: 0.45, glow: 0.4, fog: 0.35, morph: false }
    - id: menger-tunnel
      label: Menger Tunnel
      values: { preset: menger-tunnel, fractalType: menger, palette: ice, zoomSpeed: 0.5, glow: 0.25, fog: 0.15, morph: false }
    - id: sierpinski-crystal
      label: Crystal Spire
      values: { preset: sierpinski-crystal, fractalType: sierpinski, palette: acid, zoomSpeed: 0.42, glow: 0.5, fog: 0.1, morph: true }
    - id: julia-quaternion
      label: Quaternion Bloom
      values: { preset: julia-quaternion, fractalType: julia4d, palette: sunset, zoomSpeed: 0.48, glow: 0.45, fog: 0.25, morph: true }
    - id: kaleido-ifs
      label: Kaleidoscope
      values: { preset: kaleido-ifs, fractalType: kaleido, palette: neon, zoomSpeed: 0.4, glow: 0.55, fog: 0.2, morph: true }
    - id: mandel-deep
      label: Seahorse Valley
      values: { preset: mandel-deep, fractalType: mandel2d, palette: deep, zoomSpeed: 0.6, glow: 0.3, fog: 0.05, morph: false }
    - id: julia-deep
      label: Julia Spiral
      values: { preset: julia-deep, fractalType: julia2d, palette: cosmic, zoomSpeed: 0.58, glow: 0.35, fog: 0.08, morph: true }
