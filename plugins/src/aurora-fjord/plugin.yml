id: aurora-fjord
name: Aurora Fjord
version: 1
hint: A night fjord under the aurora — the curtains' strength, speed and latitude follow the live NOAA planetary K-index, top talkers are cabin lights along the shore, packets ripple the still water, and failed units roll a fog bank in from the fjord head.
description: >-
  Terrain and shore are Blender-built GLBs (blender/build_fjord.py: a sculpted fjord heightmap
  painted with CC0 Poly Haven rock, snow, forest-floor and shingle scans, fir impostor cards
  rendered from the Poly Haven fir scan, scanned boulders and plank-and-slate cabins with
  emissive windows, then gltfpack -cc -kn -km) drawn by the host mesh lane. The host scenery
  mirrors them in the water, lights the cabin windows from viz slot 1 and lays packet ripples
  from slot 2. The sky shader raymarches the aurora, the stars, the open water's reflection and
  the haze / fog bank; the sandbox (frontend/fjord.ts) reads Kp from the bound noaa-kp source
  (a demo Kp curve when the source is absent or offline), runs rate-ranked cabin slots with
  hysteresis, the ripple pool, the fog and the camera. Standard and HD model sets via modelSet;
  per-frame caps in workBudget. Idle host fixture keeps demo talkers and packets on the water.
capabilities:
  - viz.read
  - viz.write
  - config.read
