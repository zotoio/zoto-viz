id: aquarium
name: Aquarium
version: 1
hint: Photoreal tank — talkers are fish, packets are bubbles and plankton, SYS failures cloud the water.
description: >-
  Raymarched glass aquarium (procedural GLSL only). Data mapping is declared in
  data-mapping.yml (talkers→fish by id, packets→particles, sys.failed→tank murk).
  Per-frame work budget (counts): raymarch steps 72, fish instances ≤16, particles ≤16,
  draw calls 1 (host plugin sky). Caps match viz below.
  QE idle-failed: host idle fixture with sys.failed above FAIL_MURK_THRESHOLD — tank murk + fail band.
  Corner species legend and high-contrast fish colours stay readable on 2×2 / 4×4 wall tiles.
capabilities:
  - viz.read
  - viz.write
  - config.read
viz:
  graphWalk: false
  idle:
    fixture: host
  maxBuffers: 3
  maxBufferFloats: 64
  maxParticles: 24
  uniforms:
    - uTime
    - uAudio
    - uAccent
    - uBg
    - uBright
    - uOpacity
frontend:
  entry: frontend/index.ts
