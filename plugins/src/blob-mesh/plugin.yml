id: blob-mesh
name: Blob Mesh
version: 1
hint: Lumen Reef. Each device is a glowing cell on a slow spring drift (wired calm, Wi-Fi swaying, Bluetooth loose); traffic between devices grows membrane bridges that merge the cells and carry light pulses.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  contract: 2
  maxBuffers: 4
  maxBufferFloats: 64
  maxParticles: 0
  uniforms:
    - uTime
    - uBright
    - uAudio
    - uAccent
    - uBg
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
