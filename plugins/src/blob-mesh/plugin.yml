id: blob-mesh
name: Blob Mesh
version: 1
hint: 90s-style metaballs. Each blob is one of your busiest devices, and the busier it is, the bigger it grows and the more it melts into its neighbours.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  contract: 2
  maxBuffers: 1
  maxBufferFloats: 32
  maxParticles: 0
  uniforms:
    - uTime
    - uBright
    - uAudio
    - uAccent
    - uBg
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
