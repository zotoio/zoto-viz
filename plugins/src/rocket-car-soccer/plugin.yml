id: rocket-car-soccer
name: Rocket Car Soccer
version: 2
hint: Self-playing boost-car arena on the plugin sky. Live talker rates boost cars; packet spikes and unit failures drive goals and Zoto Fail alerts. Caps 8 cars / 96 particles / 48 trail segments / 6 physics substeps (see pack RCS_CAPS).
description: Procedural stadium, AI 2v2–3v3, fixed-timestep physics, pooled particles/trails, replay from recorded state (no re-sim). Idle host fixture keeps a lively demo match labelled demo on the HUD. Live mapping documented in frontend/live.ts (RCS_LIVE_MAPPING).
capabilities:
  - viz.read
  - viz.write
  - config.read
datasource:
  consumes:
    - talkers
    - packets
    - sys
