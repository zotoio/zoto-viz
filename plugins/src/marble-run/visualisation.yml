engine: graph
base: protocols
idle:
  fixture: host
look:
  theme: ember
  backdrop: plugin
  stageOnly: true
  skyOpacity: 1
  skyBright: 0.95
  skySpeed: 0.12
  skyAudio: true
  gridOpacity: 0
dataMapping:
  - field: packets[].proto
    effect: marble hue (protocol hash)
    default: tcp
    clamp: hash01
  - field: packets[].size
    effect: marble radius
    default: 128
    clamp: 6..48
  - field: packets[].field
    effect: marble radius when sizeField=field
    default: 0.5
    clamp: 0..1
  - field: sys.failed
    effect: reject tray when above failThreshold
    default: 0
    clamp: 0..1
workBudget:
  maxDrawCalls: 64
  maxTriangles: 120000
  maxInstances: 48
  maxGpuBytes: 8388608
  maxSimStepsPerFrame: 4
  maxPacketsPerFrame: 8
config:
  - key: preset
    label: preset
    type: select
    default: workshop
    values:
      - [workshop, Workshop]
      - [glass-tower, Glass Tower]
      - [chaos-funnel, Chaos Funnel]
      - [calm-spiral, Calm Spiral]
    hint: Presets set seed, complexity, and materials. Change any knob after picking a preset.
  - key: seed
    label: seed
    type: number
    default: 4242
    min: 1
    max: 999999
    step: 1
    hint: Pinned layout seed. Randomise shuffles then use undo in view settings to revert.
  - key: complexity
    label: track complexity
    type: number
    default: 3
    min: 1
    max: 5
    step: 1
    hint: More pieces — spirals, loops, lifts, xylophone steps, see-saws.
  - key: maxMarbles
    label: max marbles
    type: number
    default: 32
    min: 8
    max: 48
    step: 1
    hint: Pooled instances; never exceeded.
  - key: materialTheme
    label: materials
    type: select
    default: walnut
    values:
      - [walnut, Polished walnut]
      - [oak, Light oak]
      - [brass-glass, Brass and glass]
      - [bamboo, Bamboo]
    hint: Wood tone, glass tubes, and fitting metal.
  - key: cameraMode
    label: camera
    type: select
    default: follow
    values:
      - [follow, Follow marble]
      - [wide, Wide workshop]
      - [orbit, Slow orbit]
    hint: Follow eases behind the lead marble then pulls back. Reduced motion forces wide.
  - key: jarCount
    label: collection jars
    type: number
    default: 6
    min: 3
    max: 8
    step: 1
    hint: Destination bins along the front rail.
  - key: sizeField
    label: size maps to
    type: select
    default: bytes
    values:
      - [bytes, Packet bytes]
      - [field, Normalised field]
    hint: Marble radius from bytes or field strength.
  - key: destField
    label: jar route
    type: select
    default: proto
    values:
      - [proto, Protocol name]
      - [hash, Protocol hash]
    hint: Jar slot from protocol name or stable protocol hash (never list order).
  - key: failThreshold
    label: fail threshold
    type: number
    default: 0.55
    min: 0.2
    max: 0.95
    step: 0.05
    hint: sys.failed above this sends marbles to the reject tray (Zoto Fail colour).
  - key: reducedMotion
    label: reduced motion
    type: select
    default: auto
    values:
      - [auto, Auto (wide, no cuts)]
      - [on, On]
      - [off, Off]
    hint: Holds wide shots; no fast camera rolls or shake.
