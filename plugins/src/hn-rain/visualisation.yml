engine: graph
base: sources
idle:
  fixture: host
look:
  theme: matrix
  backdrop: plugin
  skyOpacity: 1
  skyBright: 0.68
  skySpeed: 0.4
  gridOpacity: 0
config:
  - key: tilt
    label: ticker angle
    type: number
    default: 8
    min: -20
    max: 20
    step: 1
    hint: Degrees. Positive rises to the right; 0 is level.
  - key: type
    label: ticker size
    type: number
    default: 50
    min: 28
    max: 96
    step: 2
    hint: Glyph width in pixels.
  - key: pace
    label: ticker speed
    type: number
    default: 1
    min: 0.25
    max: 3
    step: 0.05
    hint: Crawl scroll rate. 1 is the shipped pace.
  - key: pics
    label: title stills
    type: boolean
    default: true
    hint: Composer 2.5 illustration for each headline, on a spinning cube that drifts around the screen. Needs a Cursor API key — https://cursor.com/dashboard/api — paste it in Settings → Agent.
  - key: source
    label: source
    type: text
    default: hn
    hint: Host source id from Settings → Sources. Empty uses every live source.
  - key: titleField
    label: title field
    type: text
    default: title
  - key: captionField
    label: caption field
    type: text
    default: summary
  - key: imageField
    label: image field
    type: text
    default: image
  - key: linkField
    label: link field
    type: text
    default: link
  - key: filter
    label: filter
    type: select
    values:
      - [all, all]
      - [has-image, pictured]
    default: all
    hint: Pictured-only is ignored here — Composer stills illustrate every title.
