engine: graph
base: sources
look:
  theme: tactical
  backdrop: plugin
  stageOnly: true
  skyOpacity: 1
  skyBright: 1.2
  skyAudio: false
  skySpeed: 0.12
  gridOpacity: 0
config:
  - key: source
    label: source
    type: text
    default: hn
    hint: Host source id from Settings → Sources. Empty uses every live source.
  - key: titleField
    label: title field
    type: text
    default: title
  - key: captionField
    label: caption field
    type: text
    default: summary
  - key: imageField
    label: image field
    type: text
    default: image
  - key: linkField
    label: link field
    type: text
    default: link
  - key: filter
    label: filter
    type: select
    values:
      - [all, all]
      - [has-image, pictured]
    default: all
    hint: Pictured-only is ignored — the teletype shows every title.
