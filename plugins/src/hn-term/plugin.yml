id: hn-term
name: HN Term
version: 1
hint: Greenscreen teletype — host-source headlines and blurbs type in and scroll up.
description: Stage-only CRT terminal. Titles plus descriptions from a host source (Hacker News by default) type character-by-character. Change source under This view, or add a plugin instance instead of forking the tree.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  maxBuffers: 1
  maxBufferFloats: 64
  maxParticles: 0
  uniforms:
    - uTime
    - uAudio
    - uAccent
    - uBg
  idle:
    fixture: host
datasource:
  consumes:
    - sources
frontend:
  entry: frontend/index.ts
