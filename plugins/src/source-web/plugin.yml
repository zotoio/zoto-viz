id: source-web
name: Source web
version: 1
hint: Host RSS, HTTP JSON, local files, user journal, and kernel ring as a graph — not the LAN. Filter by kind in this-view settings.
description: Wraps the sources graph engine. Each registry row is a hub; RSS titles, JSON leaves, file lines, and journal/kmsg records become nodes. Use kind=rss|http|file|journal|kmsg to isolate one ingest path.
datasource:
  consumes:
    - sources
