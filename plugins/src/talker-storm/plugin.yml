id: talker-storm
name: Talker Storm
version: 1
hint: Talker-driven particle storm with a hard 512-particle cap. Top talkers spawn capped xyzw records each frame.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  maxBuffers: 1
  maxBufferFloats: 8
  maxParticles: 512
  uniforms:
    - uTime
    - uBright
    - uAudio
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
