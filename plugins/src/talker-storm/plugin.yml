id: talker-storm
name: Talker Storm
version: 1
hint: Talker storm. Each top talker is a storm cell in the sky, sent in UBO slots (slot 0 counts, slot 1 cells). maxParticles stays for the host pack mirror's particle writes.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  contract: 2
  maxBuffers: 2
  maxBufferFloats: 64
  maxParticles: 512
  uniforms:
    - uTime
    - uBright
    - uAudio
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
