id: talker-storm
name: Talker Storm
version: 1
hint: Talker storm. Each top talker is a storm cell in the sky; the pack sends the cells in UBO slot 1. Slot 0 (count, audio) and the particles come from the host pack mirror, so maxParticles stays.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  contract: 2
  maxBuffers: 2
  maxBufferFloats: 64
  maxParticles: 512
  uniforms:
    - uTime
    - uBright
    - uAudio
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
