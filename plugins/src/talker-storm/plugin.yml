id: talker-storm
name: Talker Storm
version: 1
hint: Your busiest network talkers each become a storm cell in the sky. The storm brightens with the audio.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  contract: 2
  maxBuffers: 2
  maxBufferFloats: 64
  maxParticles: 512
  uniforms:
    - uTime
    - uBright
    - uAudio
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
