id: tile-health-static
name: Tile health — static detail
version: 1
picker: hidden
hint: Host dogfood pack — mayBeStatic with a still but detailed sky.
capabilities:
  - viz.read
  - viz.write
viz:
  graphWalk: false
  mayBeStatic: true
  maxBuffers: 1
  maxBufferFloats: 4
  maxParticles: 0
  uniforms:
    - uTime
    - uBright
    - uAccent
    - uBg
    - uOpacity
  idle:
    fixture: host
frontend:
  entry: frontend/index.ts
