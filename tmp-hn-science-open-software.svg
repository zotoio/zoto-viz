<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Science Is Open Software">
  <defs>
    <radialGradient id="nebula" cx="55%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="35%" stop-color="#e8dcc8"/>
      <stop offset="70%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6600" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-frame background -->
  <rect width="1600" height="900" fill="url(#nebula)"/>

  <!-- Distant star field -->
  <g fill="#f5f0e6" opacity="0.85">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="280" cy="140" r="1.5"/>
    <circle cx="420" cy="60" r="2.5"/>
    <circle cx="680" cy="110" r="1.5"/>
    <circle cx="890" cy="70" r="2"/>
    <circle cx="1050" cy="130" r="1.5"/>
    <circle cx="1280" cy="90" r="2"/>
    <circle cx="1450" cy="160" r="1.5"/>
    <circle cx="150" cy="720" r="2"/>
    <circle cx="340" cy="810" r="1.5"/>
    <circle cx="520" cy="760" r="2"/>
    <circle cx="1180" cy="780" r="2"/>
    <circle cx="1380" cy="820" r="1.5"/>
    <circle cx="1520" cy="740" r="2"/>
  </g>
  <g fill="#ff6600" opacity="0.9">
    <circle cx="200" cy="220" r="3"/>
    <circle cx="760" cy="180" r="2.5"/>
    <circle cx="1320" cy="240" r="3"/>
    <circle cx="980" cy="680" r="2.5"/>
    <circle cx="450" cy="640" r="2"/>
    <circle cx="1480" cy="520" r="2.5"/>
  </g>

  <!-- Orbital rings -->
  <g fill="none" stroke="#ff6600" stroke-width="3" opacity="0.75">
    <ellipse cx="800" cy="450" rx="520" ry="180" transform="rotate(-12 800 450)"/>
    <ellipse cx="800" cy="450" rx="420" ry="145" transform="rotate(18 800 450)" opacity="0.55"/>
    <ellipse cx="800" cy="450" rx="620" ry="210" transform="rotate(-28 800 450)" opacity="0.35"/>
  </g>

  <!-- Central glow -->
  <circle cx="800" cy="420" r="280" fill="url(#glow)" filter="url(#softGlow)"/>

  <!-- DNA / helix morphing into open braces -->
  <g transform="translate(800 430)">
    <!-- Left helix strand -->
    <path d="M-180,-160 C-120,-120 -60,-80 -20,-40 C20,0 60,40 100,80 C140,120 160,150 180,180" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <path d="M-180,-160 C-120,-120 -60,-80 -20,-40 C20,0 60,40 100,80 C140,120 160,150 180,180" fill="none" stroke="#ff6600" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Right helix strand -->
    <path d="M180,-160 C120,-120 60,-80 20,-40 C-20,0 -60,40 -100,80 C-140,120 -160,150 -180,180" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <path d="M180,-160 C120,-120 60,-80 20,-40 C-20,0 -60,40 -100,80 C-140,120 -160,150 -180,180" fill="none" stroke="#ff6600" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Base pairs -->
    <g stroke="#f5f0e6" stroke-width="5" stroke-linecap="round">
      <line x1="-130" y1="-115" x2="130" y2="-115"/>
      <line x1="-95" y1="-75" x2="95" y2="-75"/>
      <line x1="-55" y1="-35" x2="55" y2="-35"/>
      <line x1="-15" y1="5" x2="15" y2="5"/>
      <line x1="25" y1="45" x2="-25" y2="45"/>
      <line x1="65" y1="85" x2="-65" y2="85"/>
      <line x1="105" y1="125" x2="-105" y2="125"/>
    </g>
    <g fill="#ff6600">
      <circle cx="-130" cy="-115" r="10"/>
      <circle cx="130" cy="-115" r="10"/>
      <circle cx="-55" cy="-35" r="10"/>
      <circle cx="55" cy="-35" r="10"/>
      <circle cx="25" cy="45" r="10"/>
      <circle cx="-25" cy="45" r="10"/>
      <circle cx="105" cy="125" r="10"/>
      <circle cx="-105" cy="125" r="10"/>
    </g>

    <!-- Open source braces -->
    <text x="-260" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="220" font-weight="900" fill="#000000">{</text>
    <text x="180" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="220" font-weight="900" fill="#000000">}</text>
    <text x="-260" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="220" font-weight="900" fill="#ff6600" opacity="0.35">{</text>
    <text x="180" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="220" font-weight="900" fill="#ff6600" opacity="0.35">}</text>
  </g>

  <!-- Atom / molecule nodes -->
  <g>
    <circle cx="320" cy="320" r="48" fill="#000000"/>
    <circle cx="320" cy="320" r="28" fill="#ff6600"/>
    <circle cx="1280" cy="300" r="38" fill="#000000"/>
    <circle cx="1280" cy="300" r="22" fill="#f5f0e6"/>
    <circle cx="1100" cy="560" r="32" fill="#000000"/>
    <circle cx="1100" cy="560" r="18" fill="#ff6600"/>
    <circle cx="260" cy="560" r="36" fill="#000000"/>
    <circle cx="260" cy="560" r="20" fill="#f5f0e6"/>
    <line x1="352" y1="340" x2="520" y2="400" stroke="#ff6600" stroke-width="6"/>
    <line x1="1248" y1="318" x2="1080" y2="540" stroke="#f5f0e6" stroke-width="5"/>
    <line x1="288" y1="548" x2="420" y2="480" stroke="#ff6600" stroke-width="5"/>
  </g>

  <!-- Telescope silhouette -->
  <g transform="translate(1180 620) rotate(-18)">
    <rect x="-8" y="-120" width="16" height="240" fill="#000000"/>
    <rect x="-70" y="-28" width="140" height="56" rx="8" fill="#000000"/>
    <rect x="62" y="-36" width="120" height="72" rx="12" fill="#000000"/>
    <rect x="70" y="-28" width="104" height="56" rx="8" fill="#ff6600"/>
    <polygon points="-90,120 -50,180 50,180 90,120" fill="#000000"/>
  </g>

  <!-- Code stream / data rays -->
  <g stroke="url(#orbitFade)" stroke-width="4" opacity="0.8">
    <path d="M0,450 Q400,420 800,450 T1600,450" fill="none"/>
    <path d="M0,500 Q500,470 900,500 T1600,520" fill="none" opacity="0.6"/>
  </g>
  <g fill="#f5f0e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" opacity="0.75">
    <text x="60" y="470">01001011</text>
    <text x="220" y="510">fn()</text>
    <text x="1240" y="470">MIT</text>
    <text x="1360" y="510">git</text>
  </g>

  <!-- Planet -->
  <circle cx="180" cy="180" r="72" fill="#000000"/>
  <circle cx="165" cy="165" r="72" fill="#ff6600" opacity="0.25"/>
  <ellipse cx="180" cy="180" rx="110" ry="22" fill="none" stroke="#f5f0e6" stroke-width="4" transform="rotate(-20 180 180)"/>

  <!-- Headline -->
  <g transform="translate(800 780)">
    <rect x="-620" y="-52" width="1240" height="104" rx="4" fill="#000000"/>
    <text x="0" y="18" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="900" fill="#f5f0e6" letter-spacing="2">SCIENCE IS OPEN SOFTWARE</text>
    <rect x="-620" y="-52" width="1240" height="8" fill="#ff6600"/>
  </g>
</svg>
