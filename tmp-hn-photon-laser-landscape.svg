<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e1"/>
      <stop offset="45%" stop-color="#ede4cf"/>
      <stop offset="100%" stop-color="#c9b99a"/>
    </linearGradient>
    <radialGradient id="beamGlow" cx="35%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#beamGlow)"/>

    <!-- star field -->
    <g fill="#000" opacity="0.12">
      <circle cx="90" cy="70" r="2"/>
      <circle cx="310" cy="130" r="1.5"/>
      <circle cx="520" cy="55" r="2.5"/>
      <circle cx="780" cy="95" r="1.5"/>
      <circle cx="1020" cy="45" r="2"/>
      <circle cx="1240" cy="110" r="1.5"/>
      <circle cx="1480" cy="80" r="2"/>
      <circle cx="160" cy="820" r="2"/>
      <circle cx="450" cy="860" r="1.5"/>
      <circle cx="1100" cy="840" r="2"/>
      <circle cx="1420" cy="790" r="1.5"/>
    </g>
    <g fill="#ff6600" opacity="0.55">
      <circle cx="220" cy="180" r="3"/>
      <circle cx="1350" cy="160" r="2.5"/>
      <circle cx="850" cy="70" r="2"/>
    </g>

    <!-- bench / horizon -->
    <path d="M0 680 L220 640 L480 660 L760 620 L1040 650 L1320 610 L1600 640 L1600 900 L0 900 Z" fill="#000" opacity="0.22"/>
    <rect x="0" y="700" width="1600" height="200" fill="#000"/>

    <!-- microscope / laser rig -->
    <g fill="#000">
      <rect x="60" y="420" width="180" height="280" rx="6"/>
      <rect x="80" y="440" width="140" height="200" rx="4" fill="#f5f0e1"/>
      <rect x="110" y="380" width="100" height="60" rx="4"/>
      <circle cx="160" cy="360" r="38"/>
      <rect x="145" y="320" width="30" height="50" rx="3"/>
      <rect x="130" y="640" width="40" height="60" rx="3"/>
      <rect x="30" y="690" width="240" height="18" rx="4"/>
    </g>
    <circle cx="160" cy="360" r="22" fill="#f5f0e1"/>
    <circle cx="160" cy="360" r="12" fill="#ff6600"/>

    <!-- laser housing -->
    <rect x="200" y="340" width="120" height="44" rx="6" fill="#000"/>
    <rect x="210" y="350" width="100" height="24" rx="3" fill="#f5f0e1"/>
    <circle cx="318" cy="362" r="10" fill="#ff6600"/>

    <!-- main laser beam -->
    <polygon points="328,355 620,420 600,445 328,375" fill="url(#laserBeam)"/>
    <polygon points="328,365 620,430 610,440 328,370" fill="#ff6600" opacity="0.55"/>
    <line x1="328" y1="362" x2="620" y2="432" stroke="#ff6600" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- chip package -->
    <g transform="translate(620, 320)">
      <rect x="0" y="0" width="360" height="360" rx="14" fill="#000"/>
      <rect x="18" y="18" width="324" height="324" rx="8" fill="#f5f0e1"/>
      <rect x="48" y="48" width="264" height="264" rx="4" fill="#000"/>
      <rect x="62" y="62" width="236" height="236" fill="#f5f0e1"/>

      <!-- die traces -->
      <g stroke="#000" stroke-width="2" fill="none" opacity="0.35">
        <path d="M80 120 H280 M80 160 H260 M80 200 H280 M80 240 H240"/>
        <path d="M120 80 V280 M160 80 V280 M200 80 V280 M240 80 V280"/>
      </g>

      <!-- pins -->
      <g fill="#000">
        <rect x="70" y="-14" width="12" height="28"/>
        <rect x="110" y="-14" width="12" height="28"/>
        <rect x="150" y="-14" width="12" height="28"/>
        <rect x="190" y="-14" width="12" height="28"/>
        <rect x="230" y="-14" width="12" height="28"/>
        <rect x="270" y="-14" width="12" height="28"/>
        <rect x="70" y="346" width="12" height="28"/>
        <rect x="110" y="346" width="12" height="28"/>
        <rect x="150" y="346" width="12" height="28"/>
        <rect x="190" y="346" width="12" height="28"/>
        <rect x="230" y="346" width="12" height="28"/>
        <rect x="270" y="346" width="12" height="28"/>
        <rect x="-14" y="70" width="28" height="12"/>
        <rect x="-14" y="110" width="28" height="12"/>
        <rect x="-14" y="150" width="28" height="12"/>
        <rect x="-14" y="190" width="28" height="12"/>
        <rect x="-14" y="230" width="28" height="12"/>
        <rect x="-14" y="270" width="28" height="12"/>
        <rect x="346" y="70" width="28" height="12"/>
        <rect x="346" y="110" width="28" height="12"/>
        <rect x="346" y="150" width="28" height="12"/>
        <rect x="346" y="190" width="28" height="12"/>
        <rect x="346" y="230" width="28" height="12"/>
        <rect x="346" y="270" width="28" height="12"/>
      </g>

      <text x="180" y="195" text-anchor="middle" font-family="monospace" font-size="42" font-weight="bold" fill="#000">RP2350</text>

      <!-- laser strike -->
      <circle cx="130" cy="155" r="28" fill="url(#hotspot)"/>
      <circle cx="130" cy="155" r="14" fill="#ff6600"/>
      <circle cx="130" cy="155" r="6" fill="#f5f0e1"/>
    </g>

    <!-- photon emission map panel -->
    <rect x="1040" y="180" width="480" height="480" rx="12" fill="#000"/>
    <rect x="1060" y="200" width="440" height="400" fill="#f5f0e1"/>
    <rect x="1060" y="620" width="440" height="24" fill="#ff6600"/>
    <text x="1280" y="638" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#000">PHOTON EMISSION</text>

    <!-- emission heatmap grid -->
    <g opacity="0.15" stroke="#000" stroke-width="1">
      <line x1="1060" y1="280" x2="1500" y2="280"/>
      <line x1="1060" y1="360" x2="1500" y2="360"/>
      <line x1="1060" y1="440" x2="1500" y2="440"/>
      <line x1="1060" y1="520" x2="1500" y2="520"/>
      <line x1="1140" y1="200" x2="1140" y2="600"/>
      <line x1="1220" y1="200" x2="1220" y2="600"/>
      <line x1="1300" y1="200" x2="1300" y2="600"/>
      <line x1="1380" y1="200" x2="1380" y2="600"/>
      <line x1="1460" y1="200" x2="1460" y2="600"/>
    </g>

    <!-- photon hotspots -->
    <circle cx="1180" cy="340" r="36" fill="url(#hotspot)" opacity="0.7"/>
    <circle cx="1180" cy="340" r="14" fill="#ff6600"/>
    <circle cx="1320" cy="380" r="28" fill="url(#hotspot)" opacity="0.6"/>
    <circle cx="1320" cy="380" r="10" fill="#ff6600"/>
    <circle cx="1260" cy="460" r="22" fill="url(#hotspot)" opacity="0.55"/>
    <circle cx="1260" cy="460" r="8" fill="#ff6600"/>
    <circle cx="1400" cy="420" r="18" fill="url(#hotspot)" opacity="0.5"/>
    <circle cx="1400" cy="420" r="7" fill="#ff6600"/>
    <circle cx="1350" cy="520" r="14" fill="url(#hotspot)" opacity="0.45"/>
    <circle cx="1350" cy="520" r="5" fill="#ff6600"/>

    <!-- guiding rays from emission to laser path -->
    <g stroke="#ff6600" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M1180 340 Q980 360 750 430"/>
      <path d="M1320 380 Q1050 400 750 435"/>
      <path d="M1260 460 Q1000 470 760 440"/>
    </g>
    <polygon points="730,425 770,415 760,445" fill="#ff6600"/>

    <!-- secure debug lock -->
    <g transform="translate(680, 720)">
      <rect x="0" y="0" width="320" height="56" rx="8" fill="#000"/>
      <text x="120" y="38" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#f5f0e1">SECURE DEBUG</text>
      <rect x="230" y="-8" width="56" height="72" rx="6" fill="#ff6600"/>
      <rect x="244" y="8" width="28" height="36" rx="4" fill="#f5f0e1"/>
      <path d="M258 44 L258 58" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <circle cx="258" cy="28" r="14" fill="none" stroke="#000" stroke-width="5"/>
      <!-- broken shackle -->
      <path d="M244 18 L230 4" stroke="#ff6600" stroke-width="6" stroke-linecap="round"/>
      <path d="M272 18 L290 2" stroke="#ff6600" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- fault injection arc -->
    <path d="M750 432 Q820 520 840 710" fill="none" stroke="#ff6600" stroke-width="5" stroke-dasharray="16 10" opacity="0.8"/>

    <!-- caption bar -->
    <rect x="0" y="820" width="1600" height="80" fill="#000" opacity="0.88"/>
    <text x="40" y="862" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f5f0e1">Photon-Emission-Guided Laser Fault Injection Enables RP2350 Secure Debug</text>
    <text x="1560" y="862" text-anchor="end" font-family="monospace" font-size="16" fill="#ff6600">APOD</text>

    <!-- orange accent stripes -->
    <rect x="0" y="0" width="1600" height="8" fill="#ff6600"/>
    <rect x="0" y="0" width="8" height="900" fill="#ff6600" opacity="0.6"/>
    <rect x="1592" y="0" width="8" height="900" fill="#ff6600" opacity="0.6"/>
  </g>
</svg>
