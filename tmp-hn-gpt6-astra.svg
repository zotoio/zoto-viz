<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe0"/>
      <stop offset="55%" stop-color="#ede4cf"/>
      <stop offset="100%" stop-color="#d9cdb5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ff6600" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#glow)"/>

    <!-- distant hills -->
    <path d="M0 620 L120 560 L260 590 L420 520 L580 570 L760 500 L920 540 L1100 480 L1280 530 L1460 490 L1600 540 L1600 900 L0 900 Z" fill="#1a1a1a" opacity="0.18"/>
    <path d="M0 680 L200 630 L380 660 L560 600 L760 640 L980 590 L1180 630 L1380 610 L1600 650 L1600 900 L0 900 Z" fill="#0d0d0d" opacity="0.35"/>

    <!-- radio waves -->
    <g fill="none" stroke="#ff6600" stroke-width="5" opacity="0.85">
      <path d="M1180 340 A120 120 0 0 1 1180 580"/>
      <path d="M1180 290 A170 170 0 0 1 1180 630"/>
      <path d="M1180 240 A220 220 0 0 1 1180 680"/>
      <path d="M1180 190 A270 270 0 0 1 1180 730"/>
    </g>

    <!-- morse dashes in sky -->
    <g fill="#ff6600" opacity="0.7">
      <rect x="180" y="120" width="48" height="10" rx="2"/>
      <rect x="240" y="120" width="48" height="10" rx="2"/>
      <rect x="300" y="120" width="20" height="10" rx="2"/>
      <rect x="330" y="120" width="48" height="10" rx="2"/>
      <rect x="390" y="120" width="20" height="10" rx="2"/>
      <rect x="420" y="120" width="20" height="10" rx="2"/>
      <rect x="450" y="120" width="48" height="10" rx="2"/>
    </g>

    <!-- Astra star constellation -->
    <g stroke="#ff6600" stroke-width="3" opacity="0.9">
      <line x1="920" y1="95" x2="980" y2="130"/>
      <line x1="980" y1="130" x2="1040" y2="88"/>
      <line x1="1040" y1="88" x2="1105" y2="125"/>
      <line x1="980" y1="130" x2="1010" y2="175"/>
      <line x1="1010" y1="175" x2="1085" y2="190"/>
    </g>
    <g fill="#ff6600">
      <circle cx="920" cy="95" r="7"/>
      <circle cx="980" cy="130" r="10"/>
      <circle cx="1040" cy="88" r="7"/>
      <circle cx="1105" cy="125" r="8"/>
      <circle cx="1010" cy="175" r="6"/>
      <circle cx="1085" cy="190" r="7"/>
    </g>
    <circle cx="980" cy="130" r="28" fill="url(#starGlow)" opacity="0.5" filter="url(#soft)"/>

    <!-- WWI radio tower -->
    <g fill="#0a0a0a">
      <rect x="1140" y="260" width="80" height="420"/>
      <polygon points="1180,180 1100,260 1260,260"/>
      <rect x="1168" y="300" width="24" height="18"/>
      <rect x="1168" y="360" width="24" height="18"/>
      <rect x="1168" y="420" width="24" height="18"/>
      <rect x="1168" y="480" width="24" height="18"/>
      <rect x="1168" y="540" width="24" height="18"/>
      <rect x="1168" y="600" width="24" height="18"/>
      <!-- cross braces -->
      <polygon points="1100,260 1180,340 1260,260 1180,340"/>
      <line x1="1100" y1="260" x2="1260" y2="260" stroke="#0a0a0a" stroke-width="8"/>
      <line x1="1115" y1="320" x2="1245" y2="320" stroke="#0a0a0a" stroke-width="6"/>
      <line x1="1125" y1="380" x2="1235" y2="380" stroke="#0a0a0a" stroke-width="6"/>
      <line x1="1135" y1="440" x2="1225" y2="440" stroke="#0a0a0a" stroke-width="6"/>
      <line x1="1145" y1="500" x2="1215" y2="500" stroke="#0a0a0a" stroke-width="6"/>
      <line x1="1155" y1="560" x2="1205" y2="560" stroke="#0a0a0a" stroke-width="6"/>
      <line x1="1160" y1="620" x2="1200" y2="620" stroke="#0a0a0a" stroke-width="6"/>
    </g>

    <!-- antenna spark -->
    <circle cx="1180" cy="175" r="18" fill="#ff6600" opacity="0.95"/>
    <circle cx="1180" cy="175" r="40" fill="#ff6600" opacity="0.25" filter="url(#soft)"/>

    <!-- cipher wheel / enigma abstract -->
    <g transform="translate(420 310)">
      <circle cx="0" cy="0" r="165" fill="#111" stroke="#ff6600" stroke-width="8"/>
      <circle cx="0" cy="0" r="130" fill="#f5efe0" stroke="#111" stroke-width="5"/>
      <circle cx="0" cy="0" r="95" fill="#111"/>
      <circle cx="0" cy="0" r="62" fill="#f5efe0" stroke="#111" stroke-width="4"/>
      <!-- rotor teeth -->
      <g fill="#ff6600">
        <rect x="-8" y="-175" width="16" height="22" rx="2"/>
        <rect x="-8" y="153" width="16" height="22" rx="2"/>
        <rect x="-175" y="-8" width="22" height="16" rx="2"/>
        <rect x="153" y="-8" width="22" height="16" rx="2"/>
        <rect x="-124" y="-124" width="22" height="16" rx="2" transform="rotate(-45 -113 -116)"/>
        <rect x="102" y="102" width="22" height="16" rx="2" transform="rotate(-45 113 110)"/>
        <rect x="102" y="-124" width="22" height="16" rx="2" transform="rotate(45 113 -116)"/>
        <rect x="-124" y="102" width="22" height="16" rx="2" transform="rotate(45 -113 110)"/>
      </g>
      <!-- letters on ring -->
      <g fill="#111" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle">
        <text x="0" y="-108">G</text>
        <text x="76" y="-76">E</text>
        <text x="108" y="0">R</text>
        <text x="76" y="82">M</text>
        <text x="0" y="118">A</text>
        <text x="-76" y="82">N</text>
        <text x="-108" y="0">F</text>
        <text x="-76" y="-76">K</text>
      </g>
      <!-- center solved mark -->
      <polygon points="0,-28 24,8 -24,8" fill="#ff6600"/>
      <rect x="-6" y="8" width="12" height="22" fill="#ff6600"/>
    </g>

    <!-- connecting beam from cipher to tower -->
    <path d="M585 310 C720 250 900 220 1080 240" fill="none" stroke="#ff6600" stroke-width="6" stroke-dasharray="18 12" opacity="0.75"/>
    <path d="M585 350 C720 320 920 300 1100 320" fill="none" stroke="#111" stroke-width="3" opacity="0.4"/>

    <!-- AI neural burst left -->
    <g transform="translate(220 420)" opacity="0.9">
      <circle cx="0" cy="0" r="55" fill="#111"/>
      <circle cx="0" cy="0" r="38" fill="#f5efe0"/>
      <text x="0" y="12" fill="#ff6600" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle">6</text>
      <g stroke="#ff6600" stroke-width="3">
        <line x1="55" y1="0" x2="95" y2="-30"/>
        <line x1="55" y1="0" x2="105" y2="20"/>
        <line x1="55" y1="0" x2="90" y2="55"/>
        <line x1="-55" y1="0" x2="-100" y2="-20"/>
        <line x1="-55" y1="0" x2="-95" y2="35"/>
        <line x1="0" y1="-55" x2="15" y2="-95"/>
        <line x1="0" y1="55" x2="-20" y2="100"/>
      </g>
      <g fill="#ff6600">
        <circle cx="95" cy="-30" r="8"/>
        <circle cx="105" cy="20" r="8"/>
        <circle cx="90" cy="55" r="8"/>
        <circle cx="-100" cy="-20" r="8"/>
        <circle cx="-95" cy="35" r="8"/>
        <circle cx="15" cy="-95" r="8"/>
        <circle cx="-20" cy="100" r="8"/>
      </g>
    </g>

    <!-- ground -->
    <rect x="0" y="680" width="1600" height="220" fill="#0a0a0a"/>

    <!-- trench silhouette -->
    <path d="M0 680 L80 680 L80 710 L160 710 L160 680 L280 680 L280 720 L400 720 L400 680 L520 680 L520 705 L640 705 L640 680 L760 680 L760 715 L900 715 L900 680 L1020 680 L1020 700 L1140 700 L1140 680 L1180 680 L1180 680 L1260 680 L1260 710 L1380 710 L1380 680 L1600 680 L1600 900 L0 900 Z" fill="#111"/>

    <!-- barbed wire -->
    <g stroke="#f5efe0" stroke-width="2" opacity="0.5" fill="none">
      <path d="M60 660 Q120 640 180 660 Q240 680 300 660 Q360 640 420 660"/>
      <path d="M60 670 Q120 650 180 670 Q240 690 300 670 Q360 650 420 670"/>
      <path d="M1300 655 Q1360 635 1420 655 Q1480 675 1540 655"/>
      <path d="M1300 665 Q1360 645 1420 665 Q1480 685 1540 665"/>
    </g>

    <!-- decoded text strip -->
    <g transform="translate(640 560)">
      <rect x="0" y="0" width="420" height="52" rx="4" fill="#ff6600"/>
      <text x="210" y="34" fill="#0a0a0a" font-family="Courier New, monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="3">ANGRiff UM 0500</text>
    </g>

    <!-- headline band -->
    <rect x="0" y="760" width="1600" height="140" fill="#0a0a0a"/>
    <rect x="0" y="760" width="1600" height="6" fill="#ff6600"/>

    <text x="60" y="815" fill="#f5efe0" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1">GPT-6 ASTRA</text>
    <text x="60" y="865" fill="#ff6600" font-family="Georgia, serif" font-size="28" font-weight="700">Solves a WWI German Radio Cipher</text>

    <!-- NASA-style metadata -->
    <text x="1540" y="815" fill="#f5efe0" font-family="Arial, sans-serif" font-size="16" text-anchor="end" opacity="0.7">IMAGE OF THE DAY</text>
    <text x="1540" y="842" fill="#f5efe0" font-family="Arial, sans-serif" font-size="14" text-anchor="end" opacity="0.5">HACKER NEWS · 2026</text>
    <text x="1540" y="865" fill="#f5efe0" font-family="Arial, sans-serif" font-size="14" text-anchor="end" opacity="0.5">CRYPTOGRAPHY · HISTORY · AI</text>

    <!-- corner marks -->
    <g stroke="#f5efe0" stroke-width="3" opacity="0.35" fill="none">
      <path d="M30 30 H70 M30 30 V70"/>
      <path d="M1570 30 H1530 M1570 30 V70"/>
      <path d="M30 730 H70 M30 730 V690"/>
    </g>
  </g>
</svg>
