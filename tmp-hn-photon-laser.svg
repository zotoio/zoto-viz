<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f5f0e1"/>
  <rect x="0" y="0" width="400" height="12" fill="#ff6600"/>
  <rect x="0" y="388" width="400" height="12" fill="#ff6600"/>
  <rect x="12" y="0" width="12" height="400" fill="#ff6600"/>
  <rect x="376" y="0" width="12" height="400" fill="#ff6600"/>

  <!-- Laser beam -->
  <polygon points="20,60 95,175 75,185 20,90" fill="#ff6600" opacity="0.85"/>
  <polygon points="20,60 95,175 85,185 30,80" fill="#ff6600" opacity="0.45"/>
  <circle cx="18" cy="58" r="14" fill="#ff6600"/>
  <rect x="4" y="52" width="28" height="12" rx="2" fill="#000"/>

  <!-- Chip body -->
  <rect x="95" y="95" width="210" height="210" rx="8" fill="#000"/>
  <rect x="108" y="108" width="184" height="184" rx="4" fill="#f5f0e1"/>

  <!-- Chip pins -->
  <g fill="#000">
    <rect x="130" y="82" width="8" height="18"/>
    <rect x="155" y="82" width="8" height="18"/>
    <rect x="180" y="82" width="8" height="18"/>
    <rect x="205" y="82" width="8" height="18"/>
    <rect x="230" y="82" width="8" height="18"/>
    <rect x="255" y="82" width="8" height="18"/>
    <rect x="130" y="300" width="8" height="18"/>
    <rect x="155" y="300" width="8" height="18"/>
    <rect x="180" y="300" width="8" height="18"/>
    <rect x="205" y="300" width="8" height="18"/>
    <rect x="230" y="300" width="8" height="18"/>
    <rect x="255" y="300" width="8" height="18"/>
    <rect x="82" y="130" width="18" height="8"/>
    <rect x="82" y="155" width="18" height="8"/>
    <rect x="82" y="180" width="18" height="8"/>
    <rect x="82" y="205" width="18" height="8"/>
    <rect x="82" y="230" width="18" height="8"/>
    <rect x="82" y="255" width="18" height="8"/>
    <rect x="300" y="130" width="18" height="8"/>
    <rect x="300" y="155" width="18" height="8"/>
    <rect x="300" y="180" width="18" height="8"/>
    <rect x="300" y="205" width="18" height="8"/>
    <rect x="300" y="230" width="18" height="8"/>
    <rect x="300" y="255" width="18" height="8"/>
  </g>

  <!-- Die / silicon -->
  <rect x="138" y="138" width="124" height="124" rx="2" fill="#000"/>
  <rect x="148" y="148" width="104" height="104" fill="#f5f0e1"/>

  <!-- RP2350 label -->
  <text x="200" y="210" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#000">RP2350</text>

  <!-- Laser strike point -->
  <circle cx="175" cy="175" r="18" fill="#ff6600"/>
  <circle cx="175" cy="175" r="10" fill="#f5f0e1"/>
  <circle cx="175" cy="175" r="4" fill="#ff6600"/>

  <!-- Photon emission hotspots -->
  <circle cx="215" cy="165" r="6" fill="#ff6600" opacity="0.9"/>
  <circle cx="235" cy="190" r="5" fill="#ff6600" opacity="0.75"/>
  <circle cx="205" cy="210" r="7" fill="#ff6600" opacity="0.85"/>
  <circle cx="225" cy="225" r="4" fill="#ff6600" opacity="0.7"/>
  <circle cx="195" cy="235" r="5" fill="#ff6600" opacity="0.8"/>

  <!-- Emission rays -->
  <g stroke="#ff6600" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="215" y1="165" x2="245" y2="140"/>
    <line x1="215" y1="165" x2="250" y2="165"/>
    <line x1="235" y1="190" x2="265" y2="175"/>
    <line x1="205" y1="210" x2="240" y2="230"/>
    <line x1="225" y1="225" x2="255" y2="250"/>
    <line x1="195" y1="235" x2="210" y2="265"/>
  </g>

  <!-- Secure debug lock breaking -->
  <rect x="148" y="248" width="104" height="28" rx="4" fill="#000"/>
  <text x="200" y="268" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f5f0e1">SECURE DEBUG</text>
  <rect x="218" y="242" width="28" height="40" rx="3" fill="#ff6600"/>
  <rect x="226" y="250" width="12" height="16" rx="2" fill="#f5f0e1"/>
  <path d="M232 266 L232 278" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- crack -->
  <path d="M218 242 L240 282 M240 242 L218 282" stroke="#f5f0e1" stroke-width="2"/>

  <!-- Oscilloscope / detection readout -->
  <rect x="290" y="55" width="95" height="55" rx="4" fill="#000"/>
  <rect x="298" y="63" width="79" height="39" fill="#f5f0e1"/>
  <polyline points="302,92 312,78 322,88 332,70 342,82 352,65 362,75 372,68" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="337" y="58" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#f5f0e1">PHOTON</text>

  <!-- Headline -->
  <text x="200" y="345" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#000">PHOTON-EMISSION-GUIDED</text>
  <text x="200" y="358" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#000">LASER FAULT INJECTION</text>
  <text x="200" y="371" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ff6600">RP2350 SECURE DEBUG</text>
</svg>
