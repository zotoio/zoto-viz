<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="45%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#f5eed8"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5eed8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5eed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5eed8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.38" r="0.28">
      <stop offset="0%" stop-color="#f5eed8"/>
      <stop offset="55%" stop-color="#ff6600" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="onionSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5eed8"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1150" cy="340" r="210" fill="url(#sun)"/>
  <rect y="520" width="1600" height="380" fill="#f5eed8"/>
  <rect y="520" width="1600" height="120" fill="url(#haze)"/>

  <!-- distant hills -->
  <path fill="#000" opacity="0.18" d="M0 620 L180 560 L360 590 L520 540 L720 580 L920 520 L1120 560 L1320 510 L1500 550 L1600 530 L1600 900 L0 900 Z"/>
  <path fill="#000" opacity="0.32" d="M0 680 L240 640 L420 670 L640 620 L860 660 L1080 610 L1280 650 L1480 620 L1600 640 L1600 900 L0 900 Z"/>

  <!-- Golden Gate stylized -->
  <g fill="#000">
    <rect x="520" y="430" width="18" height="270"/>
    <rect x="1062" y="430" width="18" height="270"/>
    <path d="M538 460 C620 520 760 560 920 560 C1080 560 1220 520 1302 460 L1302 490 C1220 545 1080 585 920 585 C760 585 620 545 538 490 Z"/>
    <path d="M538 520 C620 575 760 610 920 610 C1080 610 1220 575 1302 520 L1302 545 C1220 595 1080 628 920 628 C760 628 620 595 538 545 Z"/>
    <path d="M538 575 C620 625 760 655 920 655 C1080 655 1220 625 1302 575 L1302 598 C1220 645 1080 672 920 672 C760 672 620 645 538 598 Z"/>
  </g>

  <!-- city silhouette -->
  <g fill="#000">
    <rect x="180" y="560" width="42" height="140"/>
    <rect x="230" y="530" width="28" height="170"/>
    <rect x="268" y="580" width="36" height="120"/>
    <rect x="312" y="545" width="22" height="155"/>
    <rect x="340" y="570" width="48" height="130"/>
    <rect x="1340" y="550" width="38" height="150"/>
    <rect x="1388" y="520" width="26" height="180"/>
    <rect x="1422" y="565" width="34" height="135"/>
    <rect x="1462" y="540" width="20" height="160"/>
    <rect x="1490" y="575" width="44" height="125"/>
  </g>

  <!-- giant onion monument -->
  <g transform="translate(800 720)">
    <ellipse cx="0" cy="40" rx="130" ry="28" fill="#000" opacity="0.25"/>
    <path fill="url(#onionSkin)" stroke="#000" stroke-width="6" d="M0 -210 C95 -210 145 -150 145 -70 C145 10 95 70 0 70 C-95 70 -145 10 -145 -70 C-145 -150 -95 -210 0 -210 Z"/>
    <path fill="none" stroke="#000" stroke-width="5" d="M-145 -70 C-95 -40 -45 -20 0 -20 C45 -20 95 -40 145 -70"/>
    <path fill="none" stroke="#000" stroke-width="5" d="M-130 -20 C-80 10 -35 30 0 30 C35 30 80 10 130 -20"/>
    <path fill="none" stroke="#000" stroke-width="5" d="M-110 30 C-65 55 -30 68 0 68 C30 68 65 55 110 30"/>
    <path fill="#ff6600" stroke="#000" stroke-width="5" d="M0 -250 L18 -205 L0 -185 L-18 -205 Z"/>
    <path fill="none" stroke="#000" stroke-width="4" d="M0 -185 C-8 -160 -8 -140 0 -120 C8 -140 8 -160 0 -185"/>
  </g>

  <!-- futures chart rising into sky -->
  <g stroke="#000" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 760 L280 720 L420 740 L560 680 L720 700 L860 620 L980 640 L1100 560 L1240 580 L1380 500"/>
    <path d="M1380 500 L1360 470 L1380 450 L1400 470 Z" fill="#ff6600" stroke="#000" stroke-width="5"/>
  </g>
  <g fill="#ff6600" stroke="#000" stroke-width="4">
    <circle cx="280" cy="720" r="10"/>
    <circle cx="560" cy="680" r="10"/>
    <circle cx="860" cy="620" r="10"/>
    <circle cx="1100" cy="560" r="10"/>
    <circle cx="1380" cy="500" r="12"/>
  </g>

  <!-- floating onion futures tokens -->
  <g>
    <g transform="translate(260 420) rotate(-12)">
      <ellipse cx="0" cy="34" rx="38" ry="8" fill="#000" opacity="0.2"/>
      <ellipse cx="0" cy="0" rx="34" ry="40" fill="#f5eed8" stroke="#000" stroke-width="4"/>
      <path fill="none" stroke="#000" stroke-width="3" d="M-34 0 C-20 12 20 12 34 0"/>
      <path fill="none" stroke="#000" stroke-width="3" d="M-30 14 C-15 24 15 24 30 14"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#000">SF</text>
    </g>
    <g transform="translate(1180 380) rotate(8)">
      <ellipse cx="0" cy="34" rx="38" ry="8" fill="#000" opacity="0.2"/>
      <ellipse cx="0" cy="0" rx="34" ry="40" fill="#ff6600" stroke="#000" stroke-width="4"/>
      <path fill="none" stroke="#000" stroke-width="3" d="M-34 0 C-20 12 20 12 34 0"/>
      <path fill="none" stroke="#000" stroke-width="3" d="M-30 14 C-15 24 15 24 30 14"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" fill="#000">OFC</text>
    </g>
  </g>

  <!-- foreground pier -->
  <path fill="#000" d="M0 820 L420 760 L420 900 L0 900 Z"/>
  <path fill="#000" d="M1180 760 L1600 820 L1600 900 L1180 900 Z"/>
  <rect x="0" y="835" width="1600" height="65" fill="#000"/>

  <!-- title band -->
  <rect x="0" y="0" width="1600" height="110" fill="#000"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" fill="#f5eed8" letter-spacing="2">SAN FRANCISCO ONION FUTURES COMPANY</text>
  <rect x="0" y="110" width="1600" height="8" fill="#ff6600"/>
</svg>
