# Overlay for the shipped Topology view. Copied to ~/.zoto-viz/plugins on
# `./zoto-viz.py plugin install` or the first monitor start. Same id as the
# built-in mode: look pins apply there; no second menu entry.
#   ./zoto-viz.py plugin validate examples/plugins/topology.yml
id: topology
name: Topology
version: 1
hint: Device roles around the gateway. Uncomment look to pin theme, sky, floor, or modulation for this view only.
engine: graph
base: topology
# look:
#   theme: midnight
#   backdrop: space
#   gridShape: circle
#   bgAudio: true
#   skyAudio: true
#   gridAudio: true
