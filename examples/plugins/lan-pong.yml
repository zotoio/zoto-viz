# Extra arcade view. Reuses NetPong. look pins the 3D stage; game controls stay on the view.
#   ./zoto-viz.py plugin validate examples/plugins/lan-pong.yml
id: lan-pong
name: LAN Pong
version: 1
hint: NetPong as a drop-in view. Open the plugin cog for identity; game controls stay beside the view.
engine: netpong
look:
  theme: neon
  backdrop: space
  skyOpacity: 0.85
  skyBright: 1.1
  gridShape: hex
  bgAudio: true
  skyAudio: true
  gridAudio: false
  themeCycle: "off"
  skyCycle: "off"
