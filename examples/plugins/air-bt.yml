# Bluetooth devices this adapter can hear, with decoded advertisements.
# Copy to ~/.zoto-viz/plugins/ and refresh the UI.
#   ./zoto-viz.py plugin validate examples/plugins/air-bt.yml
id: air-bt
name: Air Bluetooth
version: 1
hint: Advertisers around this host. Names come from an inquiry scan; HCI capture decodes advertisement payloads when dumpcap can open bluetooth0. This adapter does not hear two neighbours talking to each other.
engine: graph
base: bluetooth
look:
  theme: nord
  backdrop: none
  gridShape: diamond
  gridColor: "#4c566a"
  bgOpacity: 0.9
  skyAudio: false
  gridAudio: true
style:
  nodeColor: kind
  labels: all
  flatten: true
layout:
  lanShell: 280
  internetShell: 520
