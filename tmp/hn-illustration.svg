<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ff6600" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#f5f0e1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Stars -->
  <g fill="#f5f0e1" opacity="0.55">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="340" cy="140" r="1"/>
    <circle cx="890" cy="60" r="1.2"/>
    <circle cx="1420" cy="110" r="1.8"/>
    <circle cx="1560" cy="220" r="1"/>
    <circle cx="210" cy="310" r="1"/>
    <circle cx="1480" cy="380" r="1.3"/>
    <circle cx="70" cy="520" r="1.2"/>
    <circle cx="1530" cy="640" r="1"/>
    <circle cx="420" cy="780" r="1.5"/>
    <circle cx="1180" cy="820" r="1"/>
  </g>

  <!-- Horizon arc -->
  <path d="M 0 620 Q 800 480 1600 620 L 1600 900 L 0 900 Z" fill="#0d0d0d"/>
  <path d="M 0 620 Q 800 500 1600 620" fill="none" stroke="#ff6600" stroke-width="3" opacity="0.7"/>

  <!-- LEFT: One year ago - parallel decision nodes (non-autoregressive) -->
  <g transform="translate(180, 280)">
    <text x="0" y="-30" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.12em" opacity="0.85">ONE YEAR AGO</text>
    <!-- Central hub -->
    <circle cx="0" cy="120" r="36" fill="#ff6600"/>
    <circle cx="0" cy="120" r="22" fill="#0a0a0a"/>
    <!-- Parallel branches - all at once, not sequential -->
    <line x1="0" y1="84" x2="-120" y2="-40" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="84" x2="0" y2="-60" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="84" x2="120" y2="-40" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <line x1="36" y1="120" x2="160" y2="120" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="156" x2="-100" y2="240" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="156" x2="100" y2="240" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
    <!-- Decision nodes -->
    <rect x="-140" y="-60" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <rect x="-22" y="-80" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <rect x="98" y="-60" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <rect x="168" y="98" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <rect x="-122" y="218" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <rect x="78" y="218" width="44" height="44" rx="6" fill="#f5f0e1"/>
    <!-- Small builder figure -->
    <g transform="translate(-60, 320)">
      <rect x="0" y="30" width="50" height="60" rx="4" fill="#f5f0e1"/>
      <circle cx="25" cy="12" r="18" fill="#f5f0e1"/>
      <rect x="-8" y="50" width="20" height="8" fill="#ff6600"/>
    </g>
    <text x="-30" y="430" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="18" font-weight="600" opacity="0.7">built in parallel</text>
  </g>

  <!-- CENTER: Contrast - autoregressive chain (faded, crossed) -->
  <g transform="translate(720, 200)" opacity="0.35">
    <text x="0" y="0" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="16" letter-spacing="0.1em">AUTOREGRESSIVE</text>
    <g stroke="#f5f0e1" stroke-width="5" fill="#f5f0e1">
      <circle cx="0" cy="50" r="16"/>
      <line x1="16" y1="50" x2="74" y2="50"/>
      <circle cx="90" cy="50" r="16"/>
      <line x1="106" y1="50" x2="164" y2="50"/>
      <circle cx="180" cy="50" r="16"/>
      <line x1="196" y1="50" x2="254" y2="50"/>
      <circle cx="270" cy="50" r="16"/>
    </g>
    <line x1="-10" y1="20" x2="290" y2="90" stroke="#ff6600" stroke-width="6"/>
  </g>

  <!-- RIGHT: Frontier lab monument -->
  <g transform="translate(1050, 120)">
    <!-- Lab structure -->
    <polygon points="250,0 450,520 50,520" fill="#0a0a0a" stroke="#f5f0e1" stroke-width="4"/>
    <polygon points="250,80 380,480 120,480" fill="#111111"/>
    <!-- Orange beacon -->
    <circle cx="250" cy="60" r="28" fill="#ff6600" filter="url(#soft)"/>
    <circle cx="250" cy="60" r="18" fill="#ff6600"/>
    <!-- Spotlight beam -->
    <polygon points="250,88 180,520 320,520" fill="#ff6600" opacity="0.12"/>
    <!-- BREAKTHROUGH banner -->
    <rect x="90" y="200" width="320" height="72" rx="4" fill="#ff6600"/>
    <text x="250" y="248" text-anchor="middle" fill="#0a0a0a" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="0.06em">BREAKTHROUGH</text>
    <text x="250" y="560" text-anchor="middle" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.14em" opacity="0.8">FRONTIER LAB</text>
  </g>

  <!-- Timeline arrow connecting past to present -->
  <g stroke="#f5f0e1" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 420 520 C 620 480, 780 500, 980 480" stroke-dasharray="12 10"/>
    <polygon points="990,480 970,472 970,488" fill="#f5f0e1" stroke="none"/>
  </g>
  <text x="700" y="510" text-anchor="middle" fill="#ff6600" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em">365 DAYS</text>

  <!-- Orbiting decision ring - visual metaphor -->
  <g transform="translate(800, 380)">
    <ellipse cx="0" cy="0" rx="280" ry="90" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.25" transform="rotate(-8)"/>
    <circle cx="-260" cy="-20" r="10" fill="#ff6600" opacity="0.6"/>
    <circle cx="0" cy="-85" r="10" fill="#ff6600" opacity="0.6"/>
    <circle cx="260" cy="-20" r="10" fill="#ff6600" opacity="0.6"/>
    <circle cx="0" cy="85" r="10" fill="#ff6600" opacity="0.6"/>
  </g>

  <!-- Headline typography -->
  <g filter="url(#textShadow)">
    <rect x="0" y="640" width="1600" height="260" fill="#0a0a0a" opacity="0.88"/>
    <rect x="0" y="640" width="1600" height="6" fill="#ff6600"/>
    <text x="80" y="720" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="42" font-weight="800">
      <tspan>I Built Non-Autoregressive Decision Models a Year Ago.</tspan>
    </text>
    <text x="80" y="780" fill="#ff6600" font-family="system-ui, sans-serif" font-size="42" font-weight="800">
      <tspan>Then a Frontier Lab Called It a </tspan>
      <tspan fill="#f5f0e1">"Breakthrough"</tspan>
    </text>
    <text x="80" y="840" fill="#f5f0e1" font-family="system-ui, sans-serif" font-size="18" font-weight="500" opacity="0.55" letter-spacing="0.06em">HACKER NEWS · NON-AUTOREGRESSIVE DECISION MODELS</text>
  </g>

  <!-- Foreground accent bars -->
  <rect x="0" y="0" width="1600" height="8" fill="#ff6600" opacity="0.9"/>
</svg>
