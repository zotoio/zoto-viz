<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Don't Let Architecture Astronauts Scare You (2001)">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ff6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0.04 0"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#horizon)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#f5f0e1" opacity="0.9">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="340" cy="140" r="1.5"/>
    <circle cx="520" cy="60" r="2.2"/>
    <circle cx="780" cy="110" r="1.8"/>
    <circle cx="980" cy="45" r="2"/>
    <circle cx="1180" cy="95" r="1.5"/>
    <circle cx="1420" cy="70" r="2"/>
    <circle cx="1500" cy="180" r="1.2"/>
    <circle cx="210" cy="220" r="1.4"/>
    <circle cx="640" cy="190" r="1.6"/>
    <circle cx="1320" cy="210" r="1.3"/>
    <circle cx="90" cy="310" r="1.5"/>
    <circle cx="1540" cy="320" r="1.7"/>
  </g>

  <!-- distant planet -->
  <circle cx="1280" cy="260" r="110" fill="#000000" stroke="#ff6600" stroke-width="6"/>
  <circle cx="1245" cy="225" r="28" fill="#f5f0e1" opacity="0.12"/>
  <ellipse cx="1280" cy="260" rx="140" ry="18" fill="none" stroke="#ff6600" stroke-width="3" opacity="0.5"/>

  <!-- monolith nod -->
  <rect x="118" y="210" width="34" height="220" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
  <rect x="126" y="218" width="18" height="204" fill="#ff6600" opacity="0.15"/>

  <!-- floating architecture blocks -->
  <g stroke="#f5f0e1" stroke-width="5" fill="none">
    <rect x="420" y="120" width="180" height="120" rx="4"/>
    <line x1="420" y1="180" x2="600" y2="180"/>
    <line x1="510" y1="120" x2="510" y2="240"/>
    <rect x="860" y="150" width="220" height="150" rx="4"/>
    <polyline points="860,225 920,225 920,195 980,195 980,255 1040,255 1040,195 1080,195"/>
    <rect x="1040" y="420" width="160" height="110" rx="4"/>
    <line x1="1040" y1="475" x2="1200" y2="475"/>
    <line x1="1120" y1="420" x2="1120" y2="530"/>
  </g>

  <!-- blueprint grid -->
  <g stroke="#ff6600" stroke-width="2" opacity="0.35">
    <line x1="0" y1="520" x2="1600" y2="520"/>
    <line x1="0" y1="580" x2="1600" y2="580"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="200" y1="480" x2="200" y2="720"/>
    <line x1="400" y1="480" x2="400" y2="720"/>
    <line x1="600" y1="480" x2="600" y2="720"/>
    <line x1="800" y1="480" x2="800" y2="720"/>
    <line x1="1000" y1="480" x2="1000" y2="720"/>
    <line x1="1200" y1="480" x2="1200" y2="720"/>
    <line x1="1400" y1="480" x2="1400" y2="720"/>
  </g>

  <!-- orange sun burst -->
  <circle cx="320" cy="430" r="95" fill="#ff6600"/>
  <g stroke="#f5f0e1" stroke-width="6" stroke-linecap="round">
    <line x1="320" y1="290" x2="320" y2="250"/>
    <line x1="320" y1="570" x2="320" y2="610"/>
    <line x1="180" y1="430" x2="140" y2="430"/>
    <line x1="460" y1="430" x2="500" y2="430"/>
    <line x1="220" y1="330" x2="192" y2="302"/>
    <line x1="420" y1="530" x2="448" y2="558"/>
    <line x1="420" y1="330" x2="448" y2="302"/>
    <line x1="220" y1="530" x2="192" y2="558"/>
  </g>

  <!-- astronaut left -->
  <g transform="translate(520 360) rotate(-18)">
    <ellipse cx="0" cy="70" rx="55" ry="70" fill="#f5f0e1"/>
    <rect x="-38" y="120" width="76" height="90" rx="18" fill="#f5f0e1"/>
    <circle cx="0" cy="-10" r="42" fill="#f5f0e1" stroke="#000000" stroke-width="5"/>
    <circle cx="0" cy="-10" r="30" fill="#000000" opacity="0.85"/>
    <rect x="-12" y="-22" width="24" height="8" fill="#ff6600"/>
    <rect x="-70" y="130" width="38" height="18" rx="8" fill="#ff6600"/>
    <rect x="32" y="130" width="38" height="18" rx="8" fill="#ff6600"/>
    <line x1="-55" y1="95" x2="-110" y2="60" stroke="#f5f0e1" stroke-width="16" stroke-linecap="round"/>
    <line x1="55" y1="95" x2="120" y2="40" stroke="#f5f0e1" stroke-width="16" stroke-linecap="round"/>
    <line x1="-20" y1="210" x2="-35" y2="280" stroke="#f5f0e1" stroke-width="16" stroke-linecap="round"/>
    <line x1="20" y1="210" x2="45" y2="285" stroke="#f5f0e1" stroke-width="16" stroke-linecap="round"/>
    <!-- clipboard blueprint -->
    <rect x="95" y="10" width="90" height="110" fill="#000000" stroke="#ff6600" stroke-width="5"/>
    <line x1="105" y1="35" x2="175" y2="35" stroke="#ff6600" stroke-width="4"/>
    <line x1="105" y1="55" x2="165" y2="55" stroke="#f5f0e1" stroke-width="4"/>
    <line x1="105" y1="75" x2="170" y2="75" stroke="#f5f0e1" stroke-width="4"/>
    <rect x="115" y="88" width="45" height="25" fill="none" stroke="#ff6600" stroke-width="4"/>
  </g>

  <!-- astronaut right (looming) -->
  <g transform="translate(1080 300) rotate(12)">
    <ellipse cx="0" cy="85" rx="68" ry="82" fill="#f5f0e1"/>
    <rect x="-48" y="145" width="96" height="105" rx="20" fill="#f5f0e1"/>
    <circle cx="0" cy="-5" r="52" fill="#f5f0e1" stroke="#000000" stroke-width="6"/>
    <circle cx="0" cy="-5" r="36" fill="#000000" opacity="0.9"/>
    <rect x="-16" y="-18" width="32" height="10" fill="#ff6600"/>
    <rect x="-85" y="155" width="45" height="20" rx="9" fill="#ff6600"/>
    <rect x="40" y="155" width="45" height="20" rx="9" fill="#ff6600"/>
    <line x1="-65" y1="110" x2="-140" y2="70" stroke="#f5f0e1" stroke-width="18" stroke-linecap="round"/>
    <line x1="65" y1="110" x2="150" y2="20" stroke="#f5f0e1" stroke-width="18" stroke-linecap="round"/>
    <line x1="-25" y1="250" x2="-45" y2="330" stroke="#f5f0e1" stroke-width="18" stroke-linecap="round"/>
    <line x1="25" y1="250" x2="55" y2="335" stroke="#f5f0e1" stroke-width="18" stroke-linecap="round"/>
    <!-- towering stack diagram -->
    <g transform="translate(120 -30)">
      <rect x="0" y="0" width="120" height="28" fill="#ff6600"/>
      <rect x="10" y="38" width="100" height="28" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
      <rect x="20" y="76" width="80" height="28" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
      <rect x="30" y="114" width="60" height="28" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
      <rect x="40" y="152" width="40" height="28" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
    </g>
  </g>

  <!-- small grounded coder -->
  <g transform="translate(760 560)">
    <rect x="-22" y="0" width="44" height="52" rx="8" fill="#000000" stroke="#f5f0e1" stroke-width="4"/>
    <rect x="-16" y="8" width="32" height="22" fill="#ff6600"/>
    <line x1="-28" y1="18" x2="-48" y2="8" stroke="#f5f0e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="18" x2="48" y2="8" stroke="#f5f0e1" stroke-width="8" stroke-linecap="round"/>
    <rect x="-18" y="52" width="14" height="28" fill="#f5f0e1"/>
    <rect x="4" y="52" width="14" height="28" fill="#f5f0e1"/>
    <rect x="-50" y="70" width="100" height="8" fill="#ff6600"/>
  </g>

  <!-- tether lines -->
  <path d="M760 560 Q900 480 980 360" fill="none" stroke="#ff6600" stroke-width="4" stroke-dasharray="14 10" opacity="0.7"/>
  <path d="M760 560 Q650 500 560 430" fill="none" stroke="#f5f0e1" stroke-width="3" stroke-dasharray="10 12" opacity="0.5"/>

  <!-- caption bar -->
  <rect x="0" y="760" width="1600" height="140" fill="#000000"/>
  <rect x="0" y="760" width="1600" height="8" fill="#ff6600"/>
  <text x="80" y="835" fill="#f5f0e1" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1">Don't Let Architecture Astronauts Scare You</text>
  <text x="80" y="878" fill="#ff6600" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">(2001)</text>
  <text x="1500" y="878" text-anchor="end" fill="#f5f0e1" font-family="Georgia, 'Times New Roman', serif" font-size="22" opacity="0.75">HN IMAGE OF THE DAY</text>

  <!-- subtle film grain overlay -->
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.35" clip-path="url(#frame)"/>
</svg>
