<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="40%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <radialGradient id="gpuGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="browserGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="directBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff6600" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="jsonStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#browserGlow)"/>

    <!-- star field -->
    <g fill="#000" opacity="0.15">
      <circle cx="95" cy="62" r="2"/>
      <circle cx="280" cy="118" r="1.5"/>
      <circle cx="510" cy="48" r="2.5"/>
      <circle cx="720" cy="88" r="1.5"/>
      <circle cx="980" cy="42" r="2"/>
      <circle cx="1180" cy="105" r="1.5"/>
      <circle cx="1380" cy="72" r="2"/>
      <circle cx="1520" cy="130" r="1.5"/>
      <circle cx="180" cy="200" r="1.5"/>
      <circle cx="1450" cy="210" r="2"/>
    </g>
    <g fill="#ff6600" opacity="0.6">
      <circle cx="350" cy="90" r="3"/>
      <circle cx="880" cy="55" r="2.5"/>
      <circle cx="1280" cy="85" r="3"/>
    </g>

    <!-- distant horizon -->
    <path d="M0 620 Q320 580 640 600 T1280 585 T1600 610 L1600 900 L0 900 Z" fill="#000" opacity="0.18"/>
    <rect x="0" y="680" width="1600" height="220" fill="#000"/>

    <!-- GPU beneath browser -->
    <ellipse cx="800" cy="720" rx="280" ry="80" fill="url(#gpuGlow)"/>
    <g transform="translate(580 640)">
      <rect x="0" y="0" width="440" height="120" rx="12" fill="#000"/>
      <rect x="16" y="16" width="408" height="88" rx="6" fill="#fff8e7"/>
      <g fill="#000">
        <rect x="36" y="36" width="48" height="48" rx="4"/>
        <rect x="96" y="36" width="48" height="48" rx="4"/>
        <rect x="156" y="36" width="48" height="48" rx="4"/>
        <rect x="216" y="36" width="48" height="48" rx="4"/>
        <rect x="276" y="36" width="48" height="48" rx="4"/>
        <rect x="336" y="36" width="48" height="48" rx="4"/>
      </g>
      <g fill="#ff6600">
        <rect x="44" y="44" width="32" height="32" rx="2"/>
        <rect x="164" y="44" width="32" height="32" rx="2"/>
        <rect x="284" y="44" width="32" height="32" rx="2"/>
      </g>
      <text x="220" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#000">LOCAL GPU</text>
    </g>

    <!-- direct logits beam (left path) -->
    <polygon points="320,380 520,340 540,360 340,400" fill="url(#directBeam)"/>
    <polygon points="320,400 520,360 540,380 340,420" fill="#ff6600" opacity="0.4"/>
    <g transform="translate(180 300)">
      <rect x="0" y="0" width="160" height="180" rx="8" fill="#000"/>
      <rect x="14" y="20" width="132" height="36" rx="4" fill="#ff6600"/>
      <rect x="14" y="68" width="132" height="36" rx="4" fill="#fff8e7"/>
      <rect x="14" y="116" width="132" height="36" rx="4" fill="#fff8e7" opacity="0.5"/>
      <text x="80" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#000">A 72%</text>
      <text x="80" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#000">B 21%</text>
      <text x="80" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#000">C 7%</text>
    </g>
    <text x="260" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fff8e7">LOGITS</text>

    <!-- JSON token stream (right path) -->
    <g transform="translate(1260 280)">
      <rect x="0" y="0" width="140" height="220" rx="8" fill="#000"/>
      <rect x="12" y="16" width="116" height="28" rx="3" fill="#fff8e7"/>
      <rect x="12" y="52" width="88" height="22" rx="3" fill="#ff6600"/>
      <rect x="12" y="82" width="104" height="22" rx="3" fill="#fff8e7"/>
      <rect x="12" y="112" width="72" height="22" rx="3" fill="#ff6600"/>
      <rect x="12" y="142" width="96" height="22" rx="3" fill="#fff8e7"/>
      <rect x="12" y="172" width="56" height="22" rx="3" fill="#ff6600"/>
      <text x="70" y="34" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#000">{"prob":</text>
      <text x="70" y="68" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#000">"A":0.72</text>
      <text x="70" y="98" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#000">"B":0.21</text>
      <text x="70" y="128" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#000">"C":0.07</text>
      <text x="70" y="158" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#000">}</text>
    </g>
    <polygon points="1080,360 1260,320 1270,340 1090,380" fill="url(#jsonStream)" opacity="0.7"/>
    <polygon points="1080,380 1260,340 1270,360 1090,400" fill="#ff6600" opacity="0.35"/>
    <text x="1340" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fff8e7">TOKENS</text>

    <!-- central browser window -->
    <g transform="translate(420 180)">
      <rect x="0" y="0" width="760" height="440" rx="16" fill="#000"/>
      <rect x="0" y="0" width="760" height="48" rx="16" fill="#000"/>
      <rect x="0" y="32" width="760" height="16" fill="#000"/>
      <circle cx="36" cy="24" r="10" fill="#ff6600"/>
      <circle cx="68" cy="24" r="10" fill="#fff8e7"/>
      <circle cx="100" cy="24" r="10" fill="#fff8e7" opacity="0.5"/>
      <rect x="200" y="12" width="360" height="24" rx="12" fill="#fff8e7"/>
      <text x="380" y="30" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#000">openjev.com  —  browser only</text>

      <rect x="20" y="68" width="720" height="352" rx="8" fill="#fff8e7"/>

      <!-- decision UI inside browser -->
      <text x="380" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#000">Give it a real choice</text>

      <g transform="translate(80 160)">
        <rect x="0" y="0" width="180" height="100" rx="8" fill="#ff6600" stroke="#000" stroke-width="4"/>
        <text x="90" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000">A</text>
        <text x="90" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#000">Account</text>
      </g>
      <g transform="translate(290 160)">
        <rect x="0" y="0" width="180" height="100" rx="8" fill="#fff8e7" stroke="#000" stroke-width="4"/>
        <text x="90" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000">B</text>
        <text x="90" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#000">Billing</text>
      </g>
      <g transform="translate(500 160)">
        <rect x="0" y="0" width="180" height="100" rx="8" fill="#fff8e7" stroke="#000" stroke-width="4"/>
        <text x="90" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000">C</text>
        <text x="90" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#000">Close</text>
      </g>

      <!-- softmax bar -->
      <rect x="80" y="300" width="520" height="36" rx="6" fill="#000"/>
      <rect x="84" y="304" width="374" height="28" rx="4" fill="#ff6600"/>
      <rect x="458" y="304" width="108" height="28" rx="0" fill="#fff8e7"/>
      <rect x="566" y="304" width="30" height="28" rx="4" fill="#fff8e7" opacity="0.4"/>
      <text x="380" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#000">softmax over supplied options  —  no backend</text>
    </g>

    <!-- neural network orb inside browser glow -->
    <circle cx="800" cy="400" r="180" fill="url(#gpuGlow)" opacity="0.35"/>

    <!-- connection arcs from browser to paths -->
    <path d="M420 380 Q300 360 260 340" stroke="#ff6600" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M1180 380 Q1300 360 1340 340" stroke="#ff6600" stroke-width="6" fill="none" opacity="0.7"/>

    <!-- floating token particles -->
    <g fill="#ff6600" opacity="0.8">
      <rect x="1120" y="260" width="18" height="12" rx="2" transform="rotate(15 1129 266)"/>
      <rect x="1150" y="290" width="14" height="10" rx="2" transform="rotate(-8 1157 295)"/>
      <rect x="1090" y="310" width="16" height="11" rx="2" transform="rotate(22 1098 315)"/>
    </g>
    <g fill="#fff8e7" opacity="0.9">
      <circle cx="380" cy="350" r="8" stroke="#000" stroke-width="3"/>
      <circle cx="410" cy="330" r="6" stroke="#000" stroke-width="2"/>
      <circle cx="350" cy="320" r="5" stroke="#000" stroke-width="2"/>
    </g>

    <!-- title -->
    <text x="800" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#000" letter-spacing="4">OpenJev</text>
    <text x="800" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ff6600" letter-spacing="6">DECISION MODEL IN YOUR BROWSER</text>

    <!-- APOD-style caption bar -->
    <rect x="0" y="820" width="1600" height="80" fill="#000" opacity="0.85"/>
    <text x="40" y="858" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fff8e7">Two paths, one GPU: read choice logits directly or generate JSON token by token  —  entirely local, no waitlist.</text>
    <text x="1560" y="858" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#ff6600">openjev.com</text>

    <!-- earth curve accent -->
    <path d="M0 680 Q800 620 1600 680" stroke="#ff6600" stroke-width="3" fill="none" opacity="0.35"/>
  </g>
</svg>
