<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="55%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="20%" stop-color="#ff6600"/>
      <stop offset="50%" stop-color="#fff8e7"/>
      <stop offset="80%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Full frame background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Horizon band -->
  <path d="M0 620 Q400 560 800 590 T1600 610 L1600 900 L0 900 Z" fill="#000000" opacity="0.92"/>

  <!-- Stars / semantic nodes -->
  <circle cx="120" cy="80" r="4" fill="#000000"/>
  <circle cx="340" cy="140" r="3" fill="#ff6600"/>
  <circle cx="520" cy="60" r="5" fill="#000000"/>
  <circle cx="780" cy="110" r="3" fill="#ff6600"/>
  <circle cx="980" cy="70" r="4" fill="#000000"/>
  <circle cx="1180" cy="130" r="3" fill="#ff6600"/>
  <circle cx="1420" cy="90" r="5" fill="#000000"/>
  <circle cx="1500" cy="180" r="3" fill="#ff6600"/>

  <!-- Left cache tower -->
  <g transform="translate(180 240)">
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#000000"/>
    <rect x="18" y="24" width="184" height="52" rx="4" fill="#fff8e7"/>
    <rect x="18" y="92" width="184" height="52" rx="4" fill="#ff6600"/>
    <rect x="18" y="160" width="184" height="52" rx="4" fill="#fff8e7"/>
    <rect x="18" y="228" width="184" height="52" rx="4" fill="#ff6600"/>
    <rect x="70" y="300" width="80" height="48" fill="#000000"/>
    <text x="110" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">KV</text>
    <text x="110" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">ATTN</text>
    <text x="110" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">EMB</text>
    <text x="110" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">CTX</text>
  </g>

  <!-- Right cache tower -->
  <g transform="translate(1200 240)">
    <rect x="0" y="0" width="220" height="320" rx="8" fill="#000000"/>
    <rect x="18" y="24" width="184" height="52" rx="4" fill="#ff6600"/>
    <rect x="18" y="92" width="184" height="52" rx="4" fill="#fff8e7"/>
    <rect x="18" y="160" width="184" height="52" rx="4" fill="#ff6600"/>
    <rect x="18" y="228" width="184" height="52" rx="4" fill="#fff8e7"/>
    <rect x="70" y="300" width="80" height="48" fill="#000000"/>
    <text x="110" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">CTX</text>
    <text x="110" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">EMB</text>
    <text x="110" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">ATTN</text>
    <text x="110" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#000000">KV</text>
  </g>

  <!-- Central glow -->
  <ellipse cx="800" cy="400" rx="340" ry="120" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Direct semantic bridge -->
  <rect x="400" y="370" width="800" height="60" rx="30" fill="url(#beam)"/>
  <rect x="430" y="385" width="740" height="30" rx="15" fill="#fff8e7" opacity="0.35"/>

  <!-- Flowing semantic tokens -->
  <g fill="#000000">
    <circle cx="480" cy="400" r="14" fill="#fff8e7" stroke="#000000" stroke-width="4"/>
    <circle cx="580" cy="400" r="14" fill="#ff6600" stroke="#000000" stroke-width="4"/>
    <circle cx="680" cy="400" r="14" fill="#fff8e7" stroke="#000000" stroke-width="4"/>
    <circle cx="780" cy="400" r="18" fill="#ff6600" stroke="#000000" stroke-width="5"/>
    <circle cx="900" cy="400" r="14" fill="#fff8e7" stroke="#000000" stroke-width="4"/>
    <circle cx="1000" cy="400" r="14" fill="#ff6600" stroke="#000000" stroke-width="4"/>
    <circle cx="1100" cy="400" r="14" fill="#fff8e7" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Semantic glyphs in stream -->
  <text x="780" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="900" fill="#000000">Σ</text>

  <!-- Connection ports -->
  <rect x="400" y="352" width="36" height="96" rx="6" fill="#ff6600"/>
  <rect x="1164" y="352" width="36" height="96" rx="6" fill="#ff6600"/>

  <!-- Bypass arc (no detour) -->
  <path d="M290 520 Q800 180 1310 520" fill="none" stroke="#000000" stroke-width="6" stroke-dasharray="18 14" opacity="0.25"/>
  <text x="800" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#000000" opacity="0.35">NO TOKEN DETOUR</text>

  <!-- LLM silhouettes -->
  <g transform="translate(290 560)">
    <circle cx="0" cy="0" r="52" fill="#000000"/>
    <rect x="-34" y="52" width="68" height="90" rx="10" fill="#000000"/>
    <circle cx="0" cy="-8" r="22" fill="#fff8e7"/>
    <rect x="-18" y="72" width="36" height="8" fill="#ff6600"/>
  </g>
  <g transform="translate(1310 560)">
    <circle cx="0" cy="0" r="52" fill="#000000"/>
    <rect x="-34" y="52" width="68" height="90" rx="10" fill="#000000"/>
    <circle cx="0" cy="-8" r="22" fill="#fff8e7"/>
    <rect x="-18" y="72" width="36" height="8" fill="#ff6600"/>
  </g>

  <!-- Title block -->
  <rect x="0" y="680" width="1600" height="220" fill="#000000"/>
  <rect x="0" y="680" width="1600" height="8" fill="#ff6600"/>
  <text x="80" y="770" font-family="Georgia, serif" font-size="54" font-weight="900" fill="#fff8e7">Cache-to-Cache</text>
  <text x="80" y="840" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ff6600">Direct Semantic Communication Between LLMs</text>
  <text x="1520" y="860" text-anchor="end" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#fff8e7" opacity="0.7">2025</text>

  <!-- Accent orbit ring -->
  <ellipse cx="800" cy="400" rx="520" ry="200" fill="none" stroke="#ff6600" stroke-width="3" opacity="0.45"/>
</svg>
