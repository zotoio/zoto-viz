<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pack mirror readback</title>
  </head>
  <body>
    <script type="module">
      import { runPackMirrorReadbackInPage } from "/src/graph/pack-mirror-readback.harness.ts";
      const q = new URLSearchParams(location.search);
      try {
        window.__readbackOk = await runPackMirrorReadbackInPage({
          dpr: Number(q.get("dpr") || "1"),
          antialias: q.get("aa") === "1",
          path: q.get("path") === "sandbox" ? "sandbox" : "host",
        });
      } catch (e) {
        window.__readbackError = e instanceof Error ? e.message : String(e);
      }
    </script>
  </body>
</html>
