[pytest]
pythonpath = .
addopts = --cov=service.agent --cov=service.tts --cov=service.paths --cov=service.plugins --cov=service.cpu --cov=service.profiles --cov=service.hooks --cov=service.access --cov=service.sysconfig --cov-report=term-missing --cov-fail-under=80
testpaths = tests

[coverage:run]
source =
    service.agent
    service.tts
    service.paths
    service.plugins
    service.cpu
    service.profiles
    service.hooks
    service.access
    service.sysconfig
omit =
    tests/*
    .venv/*

[coverage:report]
fail_under = 80
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    if TYPE_CHECKING:
